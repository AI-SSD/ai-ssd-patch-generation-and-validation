# =============================================================================
# nginx site for the AI-SSD dashboard — HTTP basic-auth in front of the
# localhost dashboard server (dashboard_server.py on 127.0.0.1:8080).
#
# Installed to /etc/nginx/sites-available/ai-ssd-dashboard and symlinked into
# sites-enabled by setup/setup_dashboard_nginx.sh. Auth users live in
# /etc/nginx/.htpasswd-ai-ssd (bcrypt). Reload with: sudo systemctl reload nginx
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Every location requires a valid user from the htpasswd file.
    auth_basic           "AI-SSD dashboard — restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-ai-ssd;

    # Long-lived log streaming: don't buffer, allow slow tails to stay open.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
