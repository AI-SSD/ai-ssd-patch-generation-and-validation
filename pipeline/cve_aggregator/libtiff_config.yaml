# =============================================================================
# CVE Aggregator Pipeline – LibTIFF Configuration  (LARGE C, CLI/PARSER SHAPE)
# =============================================================================
# Well-known C image library with a HUGE bank of memory-safety CVEs (CWE-787/125),
# reproduced IN-CONTAINER — unlike openssl/ffmpeg, no server/VM/sample-suite needed:
# a crafted TIFF fed to a built CLI tool (tiffinfo/tiff2rgba) crashes the vulnerable
# build. Chosen for (a) sheer reproducible-CVE volume and (b) exercising the CLI
# shape end-to-end.
#
# HONEST SCOPE: LibTIFF is the CLI/parser shape, only PARTIALLY supported today
# (docs/CPP_VERSATILITY_ANALYSIS.md §3):
#  * C PoCs that LINK libtiff reproduce like glibc/libxml2 (poc_prepare links -ltiff).
#  * PoCs that are a crafted INPUT FILE driving a tool (tiffinfo bad.tiff) need the
#    CLI honesty pattern (§3.3) + de-glibc'd analyzer prompts (§3.1) before they
#    record a baseline — until then they route to MANUAL (not a config error).
#  * Option A: LibTIFF ships test/*.c (harvestable); many need test/images/*.tiff
#    fixtures, so intree yield is partial.
# Build hooks are UNTESTED STARTING POINTS — expect first-run VM iteration.
# Run: python3 pipeline.py --project libtiff --phases 0 1
# =============================================================================

project:
  name: "libtiff"
  display_name: "LibTIFF"
  description: "CVE and PoC dataset for LibTIFF"

pipeline:
  abort_on_error: false
  skip_modules: []

# INTREE-FIRST (uniform pipeline-wide where a phase1.intree_test recipe exists):
# LibTIFF fixes ship golden-output `make check` tests — that is the discriminating
# oracle; the few public ExploitDB PoCs are the fallback.
reproduction_strategy:
  - intree
  - exploitdb

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/libtiff_cve_aggregator.log"

# ---------------------------------------------------------------------------
# Module 1: CVE Fetching
# ---------------------------------------------------------------------------
cve_fetcher:
  nvd_api_key: "043bad81-616b-445a-8e79-96e87cc96c66"
  keywords:
    - "libtiff"
    - "LibTIFF"
  cpe_match:
    - "cpe:2.3:a:libtiff:libtiff"
  strong_keywords:
    - "libtiff"
    - "LibTIFF"
    - "tiff"
  # Exclude downstream consumers/look-alikes that co-mention TIFF.
  non_target_indicators:
    - "GDAL"
    - "ImageMagick"
    - "GraphicsMagick"
    - "LibreOffice"
    - "Adobe"
  strict_target_matching: true
  require_project_cpe_match: false
  project_cpe_aliases:
    - "libtiff"
    - "libtiff:libtiff"
  enrich_with_cve_org: false
  cve_org_delay: 1.0
  min_published_year: 2004

# ---------------------------------------------------------------------------
# Module 2: Commit Discovery
# ---------------------------------------------------------------------------
commit_discovery:
  repo_url: "https://gitlab.com/libtiff/libtiff.git"
  repo_local_path: "../libtiff"
  clone_timeout: 600
  harvest_regression_tests: true        # superseded by reproduction_strategy; kept for clarity
  auto_update: true
  extra_grep_patterns: []
  # LibTIFF tracked on its GitLab; older bugs on bugzilla.maptools.org.
  enable_bz_fallback: true
  allow_unscoped_extra_patterns: false
  bugzilla_hosts:
    - "bugzilla.maptools.org"
    - "gitlab.com"
  enable_online_bug_resolution: false
  source_extensions:
    - ".c"
    - ".h"

# ---------------------------------------------------------------------------
# Module 3: PoC Mapping (ExploitDB)
# ---------------------------------------------------------------------------
poc_mapper:
  exploitdb_path: "../exploit-database"
  exploitdb_remote_url: "https://gitlab.com/exploit-database/exploitdb.git"
  auto_update: true
  deep_search: true
  extract_content: true
  reverse_search: true
  enable_reverse_content_grep: true
  require_verified: false
  prefer_platforms:
    - "linux"
  non_target_indicators:
    - "ImageMagick"
    - "Windows"

# ---------------------------------------------------------------------------
# Module 4–7: Aggregator / Validation / Repair / Output
# ---------------------------------------------------------------------------
data_aggregator:
  global_json_path: "results/libtiff_cve_poc_map.json"
  prune_missing_cves: true

syntax_validator:
  manual_supervision_dir: "manual_supervision"
  report_path: "results/libtiff_syntax_validation_report.json"
  allow_manual_without_commit: false

poc_repair:
  provider: "openai"
  openai_model: "gpt-4.1-mini"
  openai_api_key: ""
  api_endpoint: "http://10.3.1.226:80/api/chat"
  model: "devstral:32k"
  max_repair_attempts: 3
  models_by_attempt:
    1: "gpt-4.1-mini"
    2: "gpt-5-mini"
    3: "gpt-4.1"
  api_timeout: 600
  model_load_timeout: 300
  num_ctx: 32768
  max_poc_chars: 0

  # Estimated local generation speed (tokens/sec), used ONLY by the pre-flight
  # "too slow to repair within api_timeout" skip (provider: ollama). The default
  # 3 tok/s is a conservative CPU-only figure: at that rate any PoC larger than
  # ~api_timeout*0.8*rate output tokens is routed to manual review BEFORE the
  # repair loop — which also pre-empts the context-window ramp on large PoCs.
  # Set this to your GPU's real throughput (e.g. 30-100) so the ramp can engage.
  local_token_rate: 3
  # Same estimate for the OpenAI provider; openai windows are large so the
  # context ramp is a no-op there and only this time gate applies.
  openai_token_rate: 150
  temperature: 0.4
  report_path: "results/libtiff_poc_repair_report.json"
  manual_review_queue_path: "results/libtiff_manual_review_queue.json"
  gpu_wait_timeout: 120

output:
  global_json_path: "results/libtiff_cve_poc_map.json"
  filtered_json_path: "results/libtiff_cve_poc_map_filtered.json"
  csv_path: "results/libtiff_cve_poc_complete.csv"
  poc_dir: "exploits"
  filtered_require_commit: false
  filtered_require_poc: true
  filtered_require_verified_poc: false
  flag_unvalidated_edb_for_manual_review: true
  manual_supervision_dir: "manual_supervision"
  allow_poc_without_commit: false
  csv_fields:
    - "CVE"
    - "V_COMMIT"
    - "FilePath"
    - "F_NAME"
    - "UNIT_TYPE"
    - "V_FILE"
    - "V_FUNCTION"
    - "CVE_Description"
    - "CWE"
    - "CWE_Description"
    - "project_version"
    - "project_version_normalized"
    - "ubuntu_version"
    - "poc_index"
    - "poc_path"
    - "poc_language"
    - "FIX_COMMIT"
    - "TEST_PATH"
    - "TEST_SUBDIR"
    - "manual_review_required"
    - "manual_verified"

# ---------------------------------------------------------------------------
# Phase 2: LLM patch generation (C)
# ---------------------------------------------------------------------------
phase2:
  language: "c"
  system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for LibTIFF (the TIFF image library and its command-line tools). The
    vulnerability you must fix is {cwe}.
    Your task is to fix it by making the SMALLEST POSSIBLE EDIT to the
    vulnerable function — never by rewriting it.
  feedback_system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for LibTIFF. Your previous patch attempt for {cve_id} — {cwe} —
    FAILED validation. Analyze the failure and produce an improved fix as
    MINIMAL edits — never rewrite the whole function.
  internal_headers: []

# ---------------------------------------------------------------------------
# Phase 3: SAST (C stack — same as glibc/libxml2)
# ---------------------------------------------------------------------------
sast:
  enabled: true
  fail_on: [critical, high]
  tool_timeout: 180
  tools:
    - name: cppcheck
      detect: cppcheck
      cmd: ["cppcheck", "--enable=all", "--xml", "--xml-version=2", "{file}"]
      parser: cppcheck-xml
      install: { apt: cppcheck }
    - name: clang-tidy
      detect: clang-tidy
      cmd: ["clang-tidy", "--quiet", "--checks=clang-analyzer-*,bugprone-*,cert-*", "{file}", "--"]
      parser: regex
      regex: '^(.+?):(\d+):(\d+):\s+(warning|error):\s+(.+?)\s+\[([^\]]+)\]$'
      groups: { file: 1, line: 2, column: 3, severity: 4, message: 5, rule: 6 }
      severity_map: { warning: medium, error: high }
      install: { apt: clang-tidy }
    - name: semgrep
      detect: semgrep
      cmd: ["semgrep", "scan", "--sarif", "--quiet", "--metrics=off", "--config=p/c", "{file}"]
      parser: sarif
      install: { pip: semgrep }
    - name: flawfinder
      detect: flawfinder
      cmd: ["flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      fallback_cmd: ["{python}", "-m", "flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      parser: flawfinder
      install: { pip: flawfinder }

# ---------------------------------------------------------------------------
# Phase 1: reproduction (shared with Phase 3)
# ---------------------------------------------------------------------------
phase1:
  project_repo_local_path: "../libtiff"
  project_repo_remote_url: "https://gitlab.com/libtiff/libtiff.git"
  docker_base_image_prefix: "ai-ssd/libtiff-base"
  docker_cve_image_prefix: "ai-ssd/libtiff-cve"
  image_manifest_path: "results/libtiff_image_manifest.json"
  source_dir_name: "project-src"
  build_dir_name: "project-build"
  install_prefix: "/opt/project-build"

  # LibTIFF autotools build deps. Codec libs are optional (configure disables the
  # codecs it can't find; the core parser CVEs don't need them).
  base_packages:
    - build-essential
    - autoconf
    - automake
    - libtool
    - pkg-config
  base_packages_optional:
    - zlib1g-dev
    - libjpeg-dev
    - liblzma-dev
    - libzstd-dev
    - libwebp-dev
    - wget
    - gcc-multilib
    - g++-multilib
  base_setup: |
    dpkg --add-architecture i386 && apt-get update && apt-get install -y libc6-dev-i386 || true

  # LibTIFF builds cleanly across eras; map by commit date.
  commit_era_map:
    2004: "14.04"
    2006: "14.04"
    2008: "14.04"
    2010: "14.04"
    2012: "14.04"
    2014: "16.04"
    2016: "16.04"
    2017: "18.04"
    2018: "18.04"
    2019: "20.04"
    2020: "20.04"
    2021: "22.04"
    2022: "22.04"
    2023: "24.04"
    2024: "24.04"
    2025: "24.04"
    2026: "24.04"

  version_file: ""
  version_regex: ''
  version_era_map: {}
  enable_arch_fallback: true

  # libtiff uses the glibc allocator — surface silent heap corruption.
  poc_run_env:
    MALLOC_CHECK_: "3"
    MALLOC_PERTURB_: "42"

  # ---- build_script — STARTING POINT, UNTESTED ----
  # git checkout has no ./configure: autogen.sh/autoreconf then out-of-tree
  # configure + make + install. The build also produces the CLI tools (tools/).
  build_script: |
    #!/bin/bash
    SRC="$SOURCE_DIR"; BD="$BUILD_DIR"; PFX="$INSTALL_PREFIX"
    ARCHFLAGS=""; HOST=""
    if [ "$BUILD_ARCH" = "i386" ]; then ARCHFLAGS="-m32"; HOST="--host=i686-linux-gnu --build=i686-linux-gnu"; fi
    cd "$SRC" || exit 1
    if [ ! -x "$SRC/configure" ]; then
      ( ./autogen.sh > /build/autogen.log 2>&1 || autoreconf -fi > /build/autogen.log 2>&1 ) || true
    fi
    cd "$BD" || exit 1; rm -rf ./*
    ( "$SRC"/configure --prefix="$PFX" $HOST CFLAGS="$ARCHFLAGS -O2 -g -w -U_FORTIFY_SOURCE" 2>&1 && echo CONFIGURE_OK ) \
      > /build/cfg.log 2>&1 || { echo "CONFIGURE_FAIL"; tail -25 /build/cfg.log; }
    make -j"${SSD_MAKE_JOBS:-$(nproc)}" -k > /build/make.log 2>&1; echo "PROJECT_BUILD_EXIT_CODE=$?" >> /build/build_status; tail -20 /build/make.log
    make install -k > /build/make_install.log 2>&1; echo "PROJECT_INSTALL_EXIT_CODE=$?" >> /build/build_status
    if ls "$PFX"/lib/libtiff.so* 2>/dev/null | grep -q .; then echo "PROJECT_BUILD_INSTALLED=yes" >> /build/build_status; else echo "PROJECT_BUILD_INSTALLED=no" >> /build/build_status; fi
    echo "build complete"

  # ---- poc_prepare_script — compile the C PoC against the project libtiff ----
  # Covers C PoCs that link libtiff. NOTE: crafted-FILE PoCs that drive tiffinfo
  # bad.tiff are the CLI shape — the tools are at $INSTALL_PREFIX/bin but the CLI
  # honesty marker (§3.3) isn't implemented yet, so those route to manual.
  poc_prepare_script: |
    #!/bin/bash
    PFX="$INSTALL_PREFIX"
    M32=""; [ "$BUILD_ARCH" = "i386" ] && M32="-m32"
    cd /poc
    if grep -qE '^[[:space:]]*(int|void)?[[:space:]]*main[[:space:]]*\(' /poc/exploit_raw.c; then
      cp /poc/exploit_raw.c /poc/exploit.c
    else
      echo '#include <stdio.h>' > /poc/exploit.c
      echo '#include <stdlib.h>' >> /poc/exploit.c
      echo '#include <string.h>' >> /poc/exploit.c
      cat /poc/exploit_raw.c >> /poc/exploit.c
      echo '' >> /poc/exploit.c
      echo 'int main(int argc, char *argv[]) { puts("fragment loaded"); return 0; }' >> /poc/exploit.c
    fi
    INC="-I$PFX/include"
    rm -f /poc/exploit
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c $INC -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -ltiff -ljpeg -lz -llzma -lm 2>&1 || \
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c $INC -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -ltiff -lm 2>&1 || \
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c -ltiff 2>&1 || \
    gcc $M32 -O0 -g -w -o exploit exploit.c 2>&1 || \
    echo "compile failed"
    if [ -f /poc/exploit ]; then echo "SUCCESS"; file /poc/exploit; else echo "ERROR: failed to compile"; head -30 /poc/exploit.c; exit 1; fi
    for c in $POC_COMPANIONS; do
      stem="${c%.*}"
      case "$c" in
        *.c) ( gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" -I"$PFX/include" -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -ltiff 2>&1 || gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" 2>&1 || echo "WARN: companion $c" ) ;;
        *.sh|*.py|*.pl|*.rb) chmod +x "/poc/$c" 2>/dev/null || true ;;
      esac
    done
    USES=no
    if LD_LIBRARY_PATH="$PFX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$PFX"; then USES=yes; fi
    echo "$USES" > /poc/.ssd_poc_uses_build; echo "poc_uses_project_build: $USES"

  # No project loader needed — default launch (direct run, LD_LIBRARY_PATH=$RUN_LIB).
  poc_launch_script: ""

  # ---- patch_rebuild_script — incremental make + markers ----
  patch_rebuild_script: |
    #!/bin/bash
    cd "$BUILD_DIR" || { echo "no build dir" > /tmp/ssd_rebuild.log; }
    make -j"${SSD_MAKE_JOBS:-$(nproc)}" -k > /tmp/ssd_rebuild.log 2>&1; echo "rebuild exit: $?"; tail -30 /tmp/ssd_rebuild.log
    make install -k > /tmp/ssd_install.log 2>&1; echo "install exit: $?"
    grep -B2 -A8 "error:" /tmp/ssd_rebuild.log 2>/dev/null | head -100 > /tmp/ssd_build_errors; true
    case "$VULN_FILE" in
      *.c) OBJ="$(basename "$VULN_FILE" .c).o"; find "$BUILD_DIR" -name "$OBJ" -newer "$SOURCE_DIR/$VULN_FILE" -print -quit > /tmp/ssd_obj_rebuilt; echo "obj_rebuilt: $(cat /tmp/ssd_obj_rebuilt)" ;;
      *) echo skip > /tmp/ssd_obj_rebuilt ;;
    esac
    USES=no
    if LD_LIBRARY_PATH="$INSTALL_PREFIX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$INSTALL_PREFIX"; then USES=yes; fi
    echo "$USES" > /tmp/ssd_poc_uses_build; echo "poc_uses_build: $USES"

  # ---- Option A: in-tree regression test (poc_language: intree-test) ----
  # SHIPPED-TEST ORACLE — run the regression test the fix commit itself ships, through
  # libtiff's own test harness. Empirically (validated on fax3 bug54, commit a566b83b)
  # libtiff CVE fixes mostly add a golden-OUTPUT comparison test (test/<name>.sh +
  # refs/o-<name>.tiff, wired via add_convert_test/add_reader_test as e.g.
  # `tiffcp -c none img` then diff vs the reference), NOT a crash. So the primary oracle
  # builds libtiff and runs `make check TESTS="<the .sh the fix added>"`: the shipped test
  # FAILS on the VULNERABLE build (= reproduced) and PASSES on the PATCHED build (= fixed).
  # The build is ASan-instrumented so the harness also catches memory-safety aborts for free.
  # Fallbacks (when the fix ships no harness test): replay the crafted TIFF through the
  # ASan tools (pure crash CVEs), then a built test binary / standalone test .c.
  # Env: SOURCE_DIR, BUILD_DIR, INSTALL_PREFIX, TEST_SUBDIR, TEST_NAME, TEST_PATH, FIX_COMMIT.
  intree_test:
    build_script: |
      #!/bin/bash
      # ASan build so a crafted TIFF deterministically aborts the vulnerable build.
      SRC="$SOURCE_DIR"; BD="$BUILD_DIR"; PFX="$INSTALL_PREFIX"
      cd "$SRC" || exit 1
      if [ ! -x "$SRC/configure" ]; then
        ( ./autogen.sh > /build/autogen.log 2>&1 || autoreconf -fi > /build/autogen.log 2>&1 ) || true
      fi
      cd "$BD" || exit 1; rm -rf ./*
      export CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1 -w -U_FORTIFY_SOURCE"
      export LDFLAGS="-fsanitize=address"
      ( "$SRC"/configure --prefix="$PFX" 2>&1 && echo CONFIG_OK ) > /build/cfg.log 2>&1 || { echo CONFIG_FAIL; tail -25 /build/cfg.log; }
      make -j"${SSD_MAKE_JOBS:-$(nproc)}" -k > /build/make.log 2>&1; echo "BUILD_RC=$?" >> /build/build_status
      make install -k >> /build/make.log 2>&1 || true
      tail -15 /build/make.log; echo "build complete"
    run_script: |
      #!/bin/bash
      PFX="$INSTALL_PREFIX"
      cd "$BUILD_DIR" || { echo "SSD_TEST_RESULT=NORESULT (no build dir)"; exit 2; }
      if ! ls "$PFX"/lib/libtiff.so* 2>/dev/null | grep -q .; then
        echo "SSD_TEST_RESULT=NORESULT (no built libtiff to test against)"; exit 2
      fi
      export LD_LIBRARY_PATH="$PFX/lib"
      export ASAN_OPTIONS="abort_on_error=1:exitcode=99:detect_leaks=0:halt_on_error=1:allocator_may_return_null=1"
      findtool() { for d in "$BUILD_DIR/tools" "$PFX/bin"; do [ -x "$d/$1" ] && { echo "$d/$1"; return 0; }; done; return 1; }
      is_crash() { [ "$1" -eq 99 ] || [ "$1" -ge 128 ]; }

      # PRIMARY: run the fix commit's OWN shipped regression test(s) through the project's
      # test harness. libtiff's tests are mostly golden-output comparisons (the fix ships
      # test/<name>.sh + refs/o-<name>.tiff and wires add_convert_test/add_reader_test that
      # runs e.g. `tiffcp -c none img` then diffs the result), NOT crashes — so the harness,
      # not a guessed tool+flags, resolves the exact invocation and reference. Fail-to-pass
      # oracle: the shipped test FAILS on the vulnerable build and PASSES on the patched one.
      TESTDIR="$BUILD_DIR/test"
      if [ -d "$TESTDIR" ]; then
        SHTESTS="$(cd "$SOURCE_DIR" && git diff-tree --no-commit-id --name-only -r "$FIX_COMMIT" 2>/dev/null \
                  | grep -E '^test/.*\.sh$' | sed 's#^test/##')"
        case "$TEST_NAME" in *.sh) SHTESTS="$SHTESTS $TEST_NAME" ;; esac
        SHTESTS="$(printf '%s\n' $SHTESTS | awk 'NF&&!seen[$0]++' | tr '\n' ' ')"
        if [ -n "$SHTESTS" ]; then
          echo "--- running fix's shipped regression test(s) via harness: $SHTESTS ---"
          ( cd "$TESTDIR" && make -j"${SSD_MAKE_JOBS:-$(nproc)}" ) > /tmp/mkchk.log 2>&1 || true
          ( cd "$TESTDIR" && ASAN_OPTIONS="detect_leaks=0:allocator_may_return_null=1" \
              timeout -k 10 "${INTREE_TEST_TIMEOUT:-600}" make check TESTS="$SHTESTS" ) > /tmp/it.log 2>&1; rc=$?
          grep -E '^(PASS|FAIL|XFAIL|XPASS|ERROR|SKIP):' /tmp/it.log | head -20
          # Only trust the verdict if the harness actually ran a PASS/FAIL test (an ERROR/
          # SKIP-only result means a harness/codec setup problem, not a real fail-to-pass).
          if grep -qE '^(PASS|FAIL):' /tmp/it.log; then
            if [ "$rc" -eq 0 ]; then echo "SSD_TEST_RESULT=PASS"; exit 0; fi
            grep -iE 'differ|^FAIL:|Aborted|AddressSanitizer' /tmp/it.log | head -8
            echo "SSD_TEST_RESULT=FAIL"; exit 1
          fi
          echo "harness produced no PASS/FAIL line; falling back to crash-replay"; tail -12 /tmp/it.log
        fi
      fi

      # FALLBACK 1 (crash oracle): replay the crafted TIFF the fix commit ADDED (plus
      # TEST_PATH when it is itself an image) through the ASan-built CLI tools. Any abort =
      # reproduced. Catches pure memory-safety CVEs whose fix ships no golden-output test.
      IMGS=""
      case "$TEST_PATH" in
        *.tif|*.tiff|*.TIF|*.TIFF) [ -f "$SOURCE_DIR/$TEST_PATH" ] && IMGS="$SOURCE_DIR/$TEST_PATH" ;;
      esac
      for f in $(cd "$SOURCE_DIR" && git diff-tree --no-commit-id --name-only -r --diff-filter=A "$FIX_COMMIT" 2>/dev/null | grep -iE '\.(tif|tiff)$'); do
        [ -f "$SOURCE_DIR/$f" ] && IMGS="$IMGS $SOURCE_DIR/$f"
      done
      IMGS="$(printf '%s\n' $IMGS | awk 'NF&&!seen[$0]++' | tr '\n' ' ')"
      if [ -n "$IMGS" ]; then
        ran=0; crashed=0; hit=""
        for IMG in $IMGS; do
          for tool in tiffinfo tiff2rgba tiffcp tiffcrop tiff2pdf tiffdump; do
            TBIN="$(findtool "$tool")" || continue
            case "$tool" in
              tiffinfo)  set -- -D "$IMG" ;;
              tiff2rgba) set -- "$IMG" /tmp/o.bin ;;
              tiffcp)    set -- "$IMG" /tmp/o.tif ;;
              tiffcrop)  set -- "$IMG" /tmp/o.tif ;;
              tiff2pdf)  set -- -o /tmp/o.pdf "$IMG" ;;
              tiffdump)  set -- "$IMG" ;;
            esac
            ran=1
            timeout -k 10 "${INTREE_TEST_TIMEOUT:-120}" "$TBIN" "$@" > /tmp/it.log 2>&1; rc=$?
            if is_crash "$rc" || grep -qiE "AddressSanitizer|SUMMARY: .*Sanitizer" /tmp/it.log; then
              crashed=1; hit="$tool (rc=$rc) on $(basename "$IMG")"; break
            fi
          done
          [ "$crashed" -eq 1 ] && break
        done
        if [ "$ran" -eq 1 ]; then
          if [ "$crashed" -eq 1 ]; then
            echo "--- CRASH: $hit ---"; grep -iE "ERROR:|SUMMARY:|#0 |#1 |#2 " /tmp/it.log | head -12
            echo "SSD_TEST_RESULT=FAIL"; exit 1
          fi
          echo "no tool crashed on the crafted image(s)"; echo "SSD_TEST_RESULT=PASS"; exit 0
        fi
      fi

      # FALLBACK 2: a built test binary the fix added (now ASan-instrumented).
      RUNDIR="$BUILD_DIR/$TEST_SUBDIR"; [ -d "$RUNDIR" ] || RUNDIR="$SOURCE_DIR/$TEST_SUBDIR"
      TBIN="$BUILD_DIR/$TEST_SUBDIR/$TEST_NAME"; [ -x "$TBIN" ] || TBIN="$BUILD_DIR/test/$TEST_NAME"
      if [ -x "$TBIN" ]; then
        echo "--- running built test: $TBIN ---"
        ( cd "$RUNDIR" 2>/dev/null; timeout -k 10 "${INTREE_TEST_TIMEOUT:-300}" "$TBIN" ) > /tmp/it.log 2>&1; rc=$?
        tail -25 /tmp/it.log
        if [ "$rc" -eq 0 ]; then echo "SSD_TEST_RESULT=PASS"; exit 0; else echo "SSD_TEST_RESULT=FAIL"; exit 1; fi
      fi

      # FALLBACK 3: standalone-compile the harvested test .c against the ASan build.
      if [ -n "$TEST_PATH" ] && [ -f "$SOURCE_DIR/$TEST_PATH" ]; then
        case "$TEST_PATH" in
          *.c)
            echo "--- standalone compile of $TEST_PATH ---"
            if gcc -fsanitize=address -O1 -g -w -D_GNU_SOURCE "$SOURCE_DIR/$TEST_PATH" \
                  -I"$PFX/include" -I"$SOURCE_DIR/libtiff" -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" \
                  -ltiff -ljpeg -lz -llzma -lm -o /tmp/itest 2>/tmp/cc.log; then
              ( cd "$RUNDIR" 2>/dev/null; timeout -k 10 "${INTREE_TEST_TIMEOUT:-300}" /tmp/itest ) > /tmp/it.log 2>&1; rc=$?
              tail -25 /tmp/it.log
              if [ "$rc" -eq 0 ]; then echo "SSD_TEST_RESULT=PASS"; exit 0; else echo "SSD_TEST_RESULT=FAIL"; exit 1; fi
            fi
            echo "standalone compile failed:"; tail -10 /tmp/cc.log 2>/dev/null ;;
        esac
      fi
      echo "SSD_TEST_RESULT=NORESULT (no crafted image, test binary, or test source)"; exit 2

  build_system: "autotools"
  extra_configure_flags: []
