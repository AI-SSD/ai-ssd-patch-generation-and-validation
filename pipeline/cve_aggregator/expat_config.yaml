# =============================================================================
# CVE Aggregator Pipeline – Expat (libexpat) Configuration  (C LIBRARY, glibc-shape)
# =============================================================================
# Small C XML parser. glibc/libxml2/libtasn1 shape: pure-C shared library,
# autotools, crash-on-parse CVEs that reproduce IN-CONTAINER (no network/VM).
# NOTE: the library lives in the repo's expat/ SUBDIR (the repo is libexpat/libexpat),
# so the build cd's into expat/ and tests are under expat/tests/.
# Build hooks are UNTESTED STARTING POINTS — expect first-run VM iteration (as
# glibc/libtasn1 needed). Run: python3 pipeline.py --project expat --phases 0 1
# =============================================================================

project:
  name: "expat"
  display_name: "Expat (libexpat)"
  description: "CVE and PoC dataset for the Expat XML parser"

pipeline:
  abort_on_error: false
  skip_modules: []

# ExploitDB preferred; fix-commit test (Option A) fallback. NOTE: expat's tests are
# a monolithic runtests.c harness (not per-CVE .c), so intree harvest is weaker here
# than libtasn1 — ExploitDB / library-link PoCs are the likely effective source.
reproduction_strategy:
  - exploitdb
  - intree

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/expat_cve_aggregator.log"

# ---------------------------------------------------------------------------
# Module 1: CVE Fetching
# ---------------------------------------------------------------------------
cve_fetcher:
  nvd_api_key: "043bad81-616b-445a-8e79-96e87cc96c66"
  keywords:
    - "expat"
    - "libexpat"
  cpe_match:
    - "cpe:2.3:a:libexpat_project:libexpat"
  strong_keywords:
    - "expat"
    - "libexpat"
  non_target_indicators:
    - "Python"          # CPython bundles expat; exclude pure-CPython CVEs
    - "PHP"
    - "Perl"
    - "wxWidgets"
  strict_target_matching: true
  require_project_cpe_match: false
  project_cpe_aliases:
    - "libexpat"
    - "libexpat_project:libexpat"
    - "expat"
  enrich_with_cve_org: false
  cve_org_delay: 1.0
  min_published_year: 2005

# ---------------------------------------------------------------------------
# Module 2: Commit Discovery
# ---------------------------------------------------------------------------
commit_discovery:
  repo_url: "https://github.com/libexpat/libexpat.git"
  repo_local_path: "../libexpat"
  clone_timeout: 600
  harvest_regression_tests: true
  auto_update: true
  extra_grep_patterns: []
  enable_bz_fallback: false
  allow_unscoped_extra_patterns: false
  bugzilla_hosts: []
  enable_online_bug_resolution: false
  source_extensions:
    - ".c"
    - ".h"

# ---------------------------------------------------------------------------
# Module 3: PoC Mapping (ExploitDB)
# ---------------------------------------------------------------------------
poc_mapper:
  exploitdb_path: "../exploit-database"
  exploitdb_remote_url: "https://gitlab.com/exploit-database/exploitdb.git"
  auto_update: true
  deep_search: true
  extract_content: true
  reverse_search: true
  enable_reverse_content_grep: true
  require_verified: false
  prefer_platforms:
    - "linux"
  non_target_indicators:
    - "Python"

# ---------------------------------------------------------------------------
# Module 4–7: Aggregator / Validation / Repair / Output
# ---------------------------------------------------------------------------
data_aggregator:
  global_json_path: "results/expat_cve_poc_map.json"
  prune_missing_cves: true

syntax_validator:
  manual_supervision_dir: "manual_supervision"
  report_path: "results/expat_syntax_validation_report.json"
  allow_manual_without_commit: false

poc_repair:
  provider: "openai"
  openai_model: "gpt-4.1-mini"
  openai_api_key: ""
  api_endpoint: "http://10.3.2.171:80/api/chat"
  model: "devstral:32k"
  max_repair_attempts: 3
  models_by_attempt:
    1: "gpt-4.1-mini"
    2: "gpt-5-mini"
    3: "gpt-4.1"
  api_timeout: 600
  model_load_timeout: 300
  num_ctx: 32768
  max_poc_chars: 0

  # Estimated local generation speed (tokens/sec), used ONLY by the pre-flight
  # "too slow to repair within api_timeout" skip (provider: ollama). The default
  # 3 tok/s is a conservative CPU-only figure: at that rate any PoC larger than
  # ~api_timeout*0.8*rate output tokens is routed to manual review BEFORE the
  # repair loop — which also pre-empts the context-window ramp on large PoCs.
  # Set this to your GPU's real throughput (e.g. 30-100) so the ramp can engage.
  local_token_rate: 3
  # Same estimate for the OpenAI provider; openai windows are large so the
  # context ramp is a no-op there and only this time gate applies.
  openai_token_rate: 150
  temperature: 0.4
  report_path: "results/expat_poc_repair_report.json"
  manual_review_queue_path: "results/expat_manual_review_queue.json"
  gpu_wait_timeout: 120

output:
  global_json_path: "results/expat_cve_poc_map.json"
  filtered_json_path: "results/expat_cve_poc_map_filtered.json"
  csv_path: "results/expat_cve_poc_complete.csv"
  poc_dir: "exploits"
  filtered_require_commit: false
  filtered_require_poc: true
  filtered_require_verified_poc: false
  flag_unvalidated_edb_for_manual_review: true
  manual_supervision_dir: "manual_supervision"
  allow_poc_without_commit: false
  csv_fields:
    - "CVE"
    - "V_COMMIT"
    - "FilePath"
    - "F_NAME"
    - "UNIT_TYPE"
    - "V_FILE"
    - "V_FUNCTION"
    - "CVE_Description"
    - "CWE"
    - "CWE_Description"
    - "project_version"
    - "project_version_normalized"
    - "ubuntu_version"
    - "poc_index"
    - "poc_path"
    - "poc_language"
    - "FIX_COMMIT"
    - "TEST_PATH"
    - "TEST_SUBDIR"
    - "manual_review_required"
    - "manual_verified"

# ---------------------------------------------------------------------------
# Phase 2: LLM patch generation (C)
# ---------------------------------------------------------------------------
phase2:
  language: "c"
  system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for Expat (the libexpat XML parsing library). Your task is to fix a security
    vulnerability by making the SMALLEST POSSIBLE EDIT to the vulnerable function
    — never by rewriting it.
  feedback_system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for Expat (libexpat). Your previous patch attempt FAILED validation. Analyze
    the failure and produce an improved fix as MINIMAL edits — never rewrite the
    whole function.
  internal_headers: []

# ---------------------------------------------------------------------------
# Phase 3: SAST (C stack)
# ---------------------------------------------------------------------------
sast:
  enabled: true
  fail_on: [critical, high]
  tool_timeout: 180
  tools:
    - name: cppcheck
      detect: cppcheck
      cmd: ["cppcheck", "--enable=all", "--xml", "--xml-version=2", "{file}"]
      parser: cppcheck-xml
      install: { apt: cppcheck }
    - name: clang-tidy
      detect: clang-tidy
      cmd: ["clang-tidy", "--quiet", "--checks=clang-analyzer-*,bugprone-*,cert-*", "{file}", "--"]
      parser: regex
      regex: '^(.+?):(\d+):(\d+):\s+(warning|error):\s+(.+?)\s+\[([^\]]+)\]$'
      groups: { file: 1, line: 2, column: 3, severity: 4, message: 5, rule: 6 }
      severity_map: { warning: medium, error: high }
      install: { apt: clang-tidy }
    - name: semgrep
      detect: semgrep
      cmd: ["semgrep", "scan", "--sarif", "--quiet", "--metrics=off", "--config=p/c", "{file}"]
      parser: sarif
      install: { pip: semgrep }
    - name: flawfinder
      detect: flawfinder
      cmd: ["flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      fallback_cmd: ["{python}", "-m", "flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      parser: flawfinder
      install: { pip: flawfinder }

# ---------------------------------------------------------------------------
# Phase 1: reproduction (shared with Phase 3)
# ---------------------------------------------------------------------------
phase1:
  project_repo_local_path: "../libexpat"
  project_repo_remote_url: "https://github.com/libexpat/libexpat.git"
  docker_base_image_prefix: "ai-ssd/expat-base"
  docker_cve_image_prefix: "ai-ssd/expat-cve"
  image_manifest_path: "results/expat_image_manifest.json"
  source_dir_name: "project-src"
  build_dir_name: "project-build"
  install_prefix: "/opt/project-build"

  base_packages:
    - build-essential
    - autoconf
    - automake
    - libtool
    - pkg-config
    - docbook2x          # expat's buildconf may want docbook tooling; optional-ish
  base_packages_optional:
    - wget
    - gcc-multilib
    - g++-multilib
  base_setup: |
    dpkg --add-architecture i386 && apt-get update && apt-get install -y libc6-dev-i386 || true

  commit_era_map:
    2005: "14.04"
    2008: "14.04"
    2010: "14.04"
    2012: "14.04"
    2014: "16.04"
    2016: "16.04"
    2017: "18.04"
    2018: "18.04"
    2019: "20.04"
    2020: "20.04"
    2021: "22.04"
    2022: "22.04"
    2023: "24.04"
    2024: "24.04"
    2025: "24.04"
    2026: "24.04"

  version_file: ""
  version_regex: ''
  version_era_map: {}
  enable_arch_fallback: true

  poc_run_env:
    MALLOC_CHECK_: "3"
    MALLOC_PERTURB_: "42"

  # ---- build_script — STARTING POINT, UNTESTED ----
  # The library lives in $SOURCE_DIR/expat (repo subdir). git checkout has no
  # configure: run buildconf.sh (generates it) then in-tree configure + make +
  # install. Builds in-tree to keep the subdir layout simple. PROJECT_BUILD_INSTALLED
  # keyed on libexpat.so via `ls | grep -q` (NOT multi-arg ls — that false-fails).
  build_script: |
    #!/bin/bash
    PFX="$INSTALL_PREFIX"
    ARCHFLAGS=""; HOST=""
    if [ "$BUILD_ARCH" = "i386" ]; then ARCHFLAGS="-m32"; HOST="--host=i686-linux-gnu --build=i686-linux-gnu"; fi
    SRC="$SOURCE_DIR"; [ -d "$SOURCE_DIR/expat" ] && SRC="$SOURCE_DIR/expat"
    cd "$SRC" || exit 1
    if [ ! -x "$SRC/configure" ]; then
      ( ./buildconf.sh > /build/bootstrap.log 2>&1 || autoreconf -fi > /build/bootstrap.log 2>&1 ) || true
    fi
    ( ./configure --prefix="$PFX" --without-docbook $HOST CFLAGS="$ARCHFLAGS -O2 -g -w -U_FORTIFY_SOURCE" 2>&1 && echo CONFIGURE_OK ) \
      > /build/cfg.log 2>&1 || { echo "CONFIGURE_FAIL"; tail -25 /build/cfg.log; }
    make -j"$(nproc)" -k > /build/make.log 2>&1; echo "PROJECT_BUILD_EXIT_CODE=$?" >> /build/build_status; tail -20 /build/make.log
    make install -k > /build/make_install.log 2>&1; echo "PROJECT_INSTALL_EXIT_CODE=$?" >> /build/build_status
    if ls "$PFX"/lib/libexpat.so* "$PFX"/lib64/libexpat.so* 2>/dev/null | grep -q .; then echo "PROJECT_BUILD_INSTALLED=yes" >> /build/build_status; else echo "PROJECT_BUILD_INSTALLED=no" >> /build/build_status; fi
    echo "build complete"

  # ---- poc_prepare_script — compile the C PoC against the project libexpat ----
  poc_prepare_script: |
    #!/bin/bash
    PFX="$INSTALL_PREFIX"
    M32=""; [ "$BUILD_ARCH" = "i386" ] && M32="-m32"
    cd /poc
    if grep -qE '^[[:space:]]*(int|void)?[[:space:]]*main[[:space:]]*\(' /poc/exploit_raw.c; then
      cp /poc/exploit_raw.c /poc/exploit.c
    else
      printf '#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n' > /poc/exploit.c
      cat /poc/exploit_raw.c >> /poc/exploit.c
      printf '\nint main(int argc,char**argv){puts("fragment loaded");return 0;}\n' >> /poc/exploit.c
    fi
    INC="-I$PFX/include"
    rm -f /poc/exploit
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c $INC -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -lexpat 2>&1 || \
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c -lexpat 2>&1 || \
    gcc $M32 -O0 -g -w -o exploit exploit.c 2>&1 || echo "compile failed"
    if [ -f /poc/exploit ]; then echo "SUCCESS"; file /poc/exploit; else echo "ERROR: failed to compile"; head -30 /poc/exploit.c; exit 1; fi
    for c in $POC_COMPANIONS; do
      stem="${c%.*}"
      case "$c" in
        *.c) ( gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" -I"$PFX/include" -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -lexpat 2>&1 || gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" 2>&1 || echo "WARN: companion $c" ) ;;
        *.sh|*.py|*.pl|*.rb) chmod +x "/poc/$c" 2>/dev/null || true ;;
      esac
    done
    USES=no
    if LD_LIBRARY_PATH="$PFX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$PFX"; then USES=yes; fi
    echo "$USES" > /poc/.ssd_poc_uses_build; echo "poc_uses_project_build: $USES"

  poc_launch_script: ""

  # ---- patch_rebuild_script — incremental in-subdir make + markers ----
  patch_rebuild_script: |
    #!/bin/bash
    SRC="$SOURCE_DIR"; [ -d "$SOURCE_DIR/expat" ] && SRC="$SOURCE_DIR/expat"
    cd "$SRC" || { echo "no source dir" > /tmp/ssd_rebuild.log; }
    make -j"$(nproc)" -k > /tmp/ssd_rebuild.log 2>&1; echo "rebuild exit: $?"; tail -30 /tmp/ssd_rebuild.log
    make install -k > /tmp/ssd_install.log 2>&1; echo "install exit: $?"
    grep -B2 -A8 "error:" /tmp/ssd_rebuild.log 2>/dev/null | head -100 > /tmp/ssd_build_errors; true
    case "$VULN_FILE" in
      *.c) OBJ="$(basename "$VULN_FILE" .c).o"; find "$SRC" -name "$OBJ" -newer "$SOURCE_DIR/$VULN_FILE" -print -quit > /tmp/ssd_obj_rebuilt; echo "obj_rebuilt: $(cat /tmp/ssd_obj_rebuilt)" ;;
      *) echo skip > /tmp/ssd_obj_rebuilt ;;
    esac
    USES=no
    if LD_LIBRARY_PATH="$INSTALL_PREFIX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$INSTALL_PREFIX"; then USES=yes; fi
    echo "$USES" > /tmp/ssd_poc_uses_build; echo "poc_uses_build: $USES"

  # ---- Option A: in-tree regression test (MONOLITHIC libcheck harness) ----
  # expat's tests are NOT per-file automake TESTS — they are compiled into ONE
  # libcheck `runtests` binary, so `make check TESTS=<name>` cannot work. The
  # run_script below builds + runs that binary directly (whole-suite exit code).
  # CAVEAT (measured): expat's regression tests migrate across files/commits over
  # time, so the HEAD-harvested test often does not discriminate on the vulnerable
  # build (suite passes) — this yields an honest "not reproduced", not a repro.
  intree_test:
    build_script: |
      #!/bin/bash
      PFX="$INSTALL_PREFIX"
      SRC="$SOURCE_DIR"; [ -d "$SOURCE_DIR/expat" ] && SRC="$SOURCE_DIR/expat"
      cd "$SRC" || exit 1
      for mf in $(git -C "$SOURCE_DIR" diff-tree --no-commit-id --name-only -r "$FIX_COMMIT" 2>/dev/null | grep -E "Makefile\.am$|Makefile\.in$"); do
        git -C "$SOURCE_DIR" checkout "$FIX_COMMIT" -- "$mf" 2>/dev/null && echo "overlaid makefile: $mf"
      done
      if [ ! -x "$SRC/configure" ]; then ( ./buildconf.sh >/build/bootstrap.log 2>&1 || autoreconf -fi >/build/bootstrap.log 2>&1 ) || true; fi
      ./configure --prefix="$PFX" --without-docbook CFLAGS="-O2 -g -w" > /build/cfg.log 2>&1 && echo CONFIG_OK || { echo CONFIG_FAIL; tail -25 /build/cfg.log; }
      make -j"$(nproc)" -k > /build/make.log 2>&1; echo "BUILD_RC=$?" >> /build/build_status
      make install -k >> /build/make.log 2>&1 || true
      tail -15 /build/make.log; echo "build complete"
    run_script: |
      #!/bin/bash
      PFX="$INSTALL_PREFIX"
      SRC="$SOURCE_DIR"; [ -d "$SOURCE_DIR/expat" ] && SRC="$SOURCE_DIR/expat"
      cd "$SRC" || { echo "SSD_TEST_RESULT=NORESULT (no source dir)"; exit 2; }
      if ! ls "$PFX"/lib/libexpat.so* "$SRC"/lib/.libs/libexpat.so* 2>/dev/null | grep -q .; then
        echo "SSD_TEST_RESULT=NORESULT (no built libexpat to test against)"; exit 2
      fi
      export LD_LIBRARY_PATH="$PFX/lib:$SRC/lib/.libs"
      # expat's tests are a MONOLITHIC libcheck harness: basic_tests.c/handlers.c/...
      # are compiled INTO one `runtests` binary — there is NO per-file automake TESTS
      # target, so `make check TESTS=<name>` cannot create a .trs (it just errors).
      # Build the binary and RUN IT DIRECTLY: libcheck's runtests runs the whole
      # suite and exits non-zero iff any case FAILED. On the vulnerable build a
      # discriminating regression case fails -> reproduced; if the suite passes, the
      # harvested test does not discriminate on this build (an HONEST "not reproduced",
      # not a harness error).
      TDIR="$SRC/tests"
      ( make -C "$TDIR" runtests || make -C "$TDIR" check_PROGRAMS ) > /tmp/mt.log 2>&1 || true
      BIN="$TDIR/runtests"
      if [ ! -x "$BIN" ]; then echo "runtests binary not built:"; tail -20 /tmp/mt.log; echo "SSD_TEST_RESULT=NORESULT"; exit 2; fi
      echo "--- running monolithic libcheck harness: $BIN ---"
      ( cd "$TDIR" && timeout "${INTREE_TEST_TIMEOUT:-400}" ./runtests ) > /tmp/it.log 2>&1; rc=$?
      tail -25 /tmp/it.log
      # libcheck runtests: exit 0 = all cases pass; non-zero (incl. crash signal) =
      # a case failed = the bug reproduced on the vulnerable build.
      if [ "$rc" -eq 0 ]; then echo "SSD_TEST_RESULT=PASS"; exit 0; else echo "SSD_TEST_RESULT=FAIL"; exit 1; fi

  build_system: "autotools"
  extra_configure_flags: []
