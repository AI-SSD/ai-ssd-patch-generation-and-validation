# =============================================================================
# CVE Aggregator Pipeline – libxml2 Configuration  (C/C++ ACID TEST)
# =============================================================================
# Second C project after glibc — the "acid test" that the modularization actually
# generalises. libxml2 is the GLIBC SHAPE (pure-C shared library, autotools), so it
# exercises the SAME hooks (build_script / poc_prepare_script / patch_rebuild_script)
# with a DIFFERENT build system invocation and a DIFFERENT library (libxml2.so vs
# libc.so.6) and NO loader-prefix (poc_launch left empty → default direct run).
# Run: ./run_project.sh ... or python3 pipeline.py --phase0-config cve_aggregator/libxml2_config.yaml
# Build hooks are UNTESTED STARTING POINTS — expect first-run VM iteration (as glibc had).
# =============================================================================

project:
  name: "libxml2"
  display_name: "libxml2"
  description: "CVE and PoC dataset for libxml2"

pipeline:
  abort_on_error: false
  skip_modules: []

# Reproducer priority (see aggregator_config.yaml for all modes). ExploitDB PoC
# preferred; the fix-commit test (Option A) is the fallback for CVEs with no PoC.
# NOTE: "intree" only RUNS once this project has a phase1.intree_test recipe
# (libxml2 has `make check`, but the recipe isn't written yet) — until then the
# harvested tests route to manual and ExploitDB is the effective source.
reproduction_strategy:
  - exploitdb
  - intree

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/libxml2_cve_aggregator.log"

# ---------------------------------------------------------------------------
# Module 1: CVE Fetching
# ---------------------------------------------------------------------------
cve_fetcher:
  nvd_api_key: "043bad81-616b-445a-8e79-96e87cc96c66"
  keywords:
    - "libxml2"
    - "libxml"
  cpe_match:
    - "cpe:2.3:a:xmlsoft:libxml2"
  strong_keywords:
    - "libxml2"
    - "libxml"
  # Exclude the sibling/binding projects that co-mention libxml2.
  non_target_indicators:
    - "libxslt"
    - "lxml"
    - "PHP"
    - ".NET"
    - "Perl XML"
  strict_target_matching: true
  require_project_cpe_match: false
  project_cpe_aliases:
    - "libxml2"
    - "xmlsoft:libxml2"
  enrich_with_cve_org: false
  cve_org_delay: 1.0
  min_published_year: 2005

# ---------------------------------------------------------------------------
# Module 2: Commit Discovery
# ---------------------------------------------------------------------------
commit_discovery:
  # GitHub mirror clones faster/more reliably than gitlab.gnome.org.
  repo_url: "https://github.com/GNOME/libxml2.git"
  repo_local_path: "../libxml2"
  clone_timeout: 900
  harvest_regression_tests: false
  auto_update: true
  extra_grep_patterns: []
  enable_bz_fallback: true
  allow_unscoped_extra_patterns: false
  # libxml2 historically tracked bugs on bugzilla.gnome.org, now gitlab issues.
  bugzilla_hosts:
    - "bugzilla.gnome.org"
    - "gitlab.gnome.org"
  enable_online_bug_resolution: false
  source_extensions:
    - ".c"
    - ".h"

# ---------------------------------------------------------------------------
# Module 3: PoC Mapping (ExploitDB)
# ---------------------------------------------------------------------------
poc_mapper:
  exploitdb_path: "../exploit-database"
  exploitdb_remote_url: "https://gitlab.com/exploit-database/exploitdb.git"
  auto_update: true
  deep_search: true                      # libxml2 PoCs are scarce — search contents too
  extract_content: true
  reverse_search: true
  enable_reverse_content_grep: true
  # libxml2 PoCs are rare and often community fuzzing repros — don't require verified.
  require_verified: false
  prefer_platforms:
    - "linux"
  non_target_indicators:
    - "libxslt"

# ---------------------------------------------------------------------------
# Module 4–7: Aggregator / Validation / Repair / Output
# ---------------------------------------------------------------------------
data_aggregator:
  global_json_path: "results/libxml2_cve_poc_map.json"
  prune_missing_cves: true

syntax_validator:
  manual_supervision_dir: "manual_supervision"
  report_path: "results/libxml2_syntax_validation_report.json"
  allow_manual_without_commit: false

poc_repair:
  provider: "openai"
  openai_model: "gpt-4.1-mini"
  openai_api_key: ""
  api_endpoint: "http://10.3.2.171:80/api/chat"
  model: "devstral:32k"
  max_repair_attempts: 3
  models_by_attempt:
    1: "gpt-4.1-mini"
    2: "gpt-5-mini"
    3: "gpt-4.1"
  api_timeout: 600
  model_load_timeout: 300
  num_ctx: 32768
  max_poc_chars: 0

  # Estimated local generation speed (tokens/sec), used ONLY by the pre-flight
  # "too slow to repair within api_timeout" skip (provider: ollama). The default
  # 3 tok/s is a conservative CPU-only figure: at that rate any PoC larger than
  # ~api_timeout*0.8*rate output tokens is routed to manual review BEFORE the
  # repair loop — which also pre-empts the context-window ramp on large PoCs.
  # Set this to your GPU's real throughput (e.g. 30-100) so the ramp can engage.
  local_token_rate: 3
  # Same estimate for the OpenAI provider; openai windows are large so the
  # context ramp is a no-op there and only this time gate applies.
  openai_token_rate: 150
  temperature: 0.4
  report_path: "results/libxml2_poc_repair_report.json"
  manual_review_queue_path: "results/libxml2_manual_review_queue.json"
  gpu_wait_timeout: 120

output:
  global_json_path: "results/libxml2_cve_poc_map.json"
  filtered_json_path: "results/libxml2_cve_poc_map_filtered.json"
  csv_path: "results/libxml2_cve_poc_complete.csv"
  poc_dir: "exploits"
  filtered_require_commit: false
  filtered_require_poc: true
  filtered_require_verified_poc: false
  flag_unvalidated_edb_for_manual_review: true
  manual_supervision_dir: "manual_supervision"
  allow_poc_without_commit: false
  csv_fields:
    - "CVE"
    - "V_COMMIT"
    - "FilePath"
    - "F_NAME"
    - "UNIT_TYPE"
    - "V_FILE"
    - "V_FUNCTION"
    - "CVE_Description"
    - "CWE"
    - "CWE_Description"
    - "project_version"
    - "project_version_normalized"
    - "ubuntu_version"
    - "poc_index"
    - "poc_path"
    - "poc_language"
    - "FIX_COMMIT"
    - "TEST_PATH"
    - "TEST_SUBDIR"
    - "manual_review_required"
    - "manual_verified"

# ---------------------------------------------------------------------------
# Phase 2: LLM patch generation (C)
# ---------------------------------------------------------------------------
phase2:
  language: "c"
  system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for libxml2 (the GNOME XML parsing library). Your task is to fix a security
    vulnerability by making the SMALLEST POSSIBLE EDIT to the vulnerable function
    — never by rewriting it.
  feedback_system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for libxml2. Your previous patch attempt FAILED validation. Analyze the
    failure and produce an improved fix as MINIMAL edits — never rewrite the whole
    function.
  internal_headers: []

# ---------------------------------------------------------------------------
# Phase 3: SAST (C stack — same as glibc/kernel)
# ---------------------------------------------------------------------------
sast:
  enabled: true
  fail_on: [critical, high]
  tool_timeout: 180
  tools:
    - name: cppcheck
      detect: cppcheck
      cmd: ["cppcheck", "--enable=all", "--xml", "--xml-version=2", "{file}"]
      parser: cppcheck-xml
      install: { apt: cppcheck }
    - name: clang-tidy
      detect: clang-tidy
      cmd: ["clang-tidy", "--quiet", "--checks=clang-analyzer-*,bugprone-*,cert-*", "{file}", "--"]
      parser: regex
      regex: '^(.+?):(\d+):(\d+):\s+(warning|error):\s+(.+?)\s+\[([^\]]+)\]$'
      groups: { file: 1, line: 2, column: 3, severity: 4, message: 5, rule: 6 }
      severity_map: { warning: medium, error: high }
      install: { apt: clang-tidy }
    - name: semgrep
      detect: semgrep
      cmd: ["semgrep", "scan", "--sarif", "--quiet", "--metrics=off", "--config=p/c", "{file}"]
      parser: sarif
      install: { pip: semgrep }
    - name: flawfinder
      detect: flawfinder
      cmd: ["flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      fallback_cmd: ["{python}", "-m", "flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      parser: flawfinder
      install: { pip: flawfinder }

# ---------------------------------------------------------------------------
# Phase 1: reproduction (shared with Phase 3)
# ---------------------------------------------------------------------------
phase1:
  project_repo_local_path: "../libxml2"
  project_repo_remote_url: "https://github.com/GNOME/libxml2.git"
  docker_base_image_prefix: "ai-ssd/libxml2-base"
  docker_cve_image_prefix: "ai-ssd/libxml2-cve"
  image_manifest_path: "results/libxml2_image_manifest.json"
  source_dir_name: "project-src"
  build_dir_name: "project-build"
  install_prefix: "/opt/project-build"

  # libxml2 autotools build deps (autogen.sh needs the autotools).
  base_packages:
    - build-essential
    - autoconf
    - automake
    - libtool
    - pkg-config
  base_packages_optional:
    - zlib1g-dev
    - liblzma-dev
    - wget
    - gcc-multilib
    - g++-multilib
  base_setup: |
    dpkg --add-architecture i386 && apt-get update && apt-get install -y libc6-dev-i386 || true

  # libxml2 builds fine across eras; map by commit date. Old trees use older bases.
  commit_era_map:
    2005: "14.04"
    2008: "14.04"
    2010: "14.04"
    2012: "14.04"
    2014: "16.04"
    2016: "16.04"
    2017: "18.04"
    2018: "18.04"
    2019: "20.04"
    2020: "20.04"
    2021: "22.04"
    2022: "22.04"
    2023: "24.04"
    2024: "24.04"
    2025: "24.04"
    2026: "24.04"

  version_file: ""
  version_regex: ''
  version_era_map: {}
  enable_arch_fallback: true

  # libxml2 uses the glibc allocator — surface silent heap corruption like glibc does.
  poc_run_env:
    MALLOC_CHECK_: "3"
    MALLOC_PERTURB_: "42"

  # ---- build_script — STARTING POINT, UNTESTED ----
  # Generate configure (git tree has none) then out-of-tree configure + make +
  # install. --without-python avoids a python-dev dependency. Writes the
  # /build/build_status markers Phase 1/3 read. i386 via $BUILD_ARCH.
  build_script: |
    #!/bin/bash
    SRC="$SOURCE_DIR"; BD="$BUILD_DIR"; PFX="$INSTALL_PREFIX"
    ARCHFLAGS=""; HOST=""
    if [ "$BUILD_ARCH" = "i386" ]; then ARCHFLAGS="-m32"; HOST="--host=i686-linux-gnu --build=i686-linux-gnu"; fi
    cd "$SRC" || exit 1
    if [ ! -x "$SRC/configure" ]; then
      NOCONFIGURE=1 ./autogen.sh > /build/autogen.log 2>&1 || autoreconf -fi > /build/autogen.log 2>&1 || true
    fi
    cd "$BD" || exit 1; rm -rf ./*
    ( "$SRC"/configure --prefix="$PFX" --without-python $HOST CFLAGS="$ARCHFLAGS -O2 -g -w -U_FORTIFY_SOURCE" 2>&1 && echo CONFIGURE_OK ) \
      > /build/cfg.log 2>&1 || { echo "CONFIGURE_FAIL"; tail -25 /build/cfg.log; }
    make -j"$(nproc)" -k > /build/make.log 2>&1; echo "PROJECT_BUILD_EXIT_CODE=$?" >> /build/build_status; tail -20 /build/make.log
    make install -k > /build/make_install.log 2>&1; echo "PROJECT_INSTALL_EXIT_CODE=$?" >> /build/build_status
    if ls "$PFX"/lib/libxml2.so* >/dev/null 2>&1; then echo "PROJECT_BUILD_INSTALLED=yes" >> /build/build_status; else echo "PROJECT_BUILD_INSTALLED=no" >> /build/build_status; fi
    echo "build complete"

  # ---- poc_prepare_script — compile the PoC against the project libxml2 ----
  # Library shape (like glibc) but simpler: no project loader, just link the build's
  # libxml2 and run under the system loader with LD_LIBRARY_PATH at the project lib
  # (the default poc_launch). Honesty = the PoC resolves the project libxml2.
  poc_prepare_script: |
    #!/bin/bash
    PFX="$INSTALL_PREFIX"
    M32=""; [ "$BUILD_ARCH" = "i386" ] && M32="-m32"
    cd /poc
    if grep -qE '^[[:space:]]*(int|void)?[[:space:]]*main[[:space:]]*\(' /poc/exploit_raw.c; then
      cp /poc/exploit_raw.c /poc/exploit.c
    else
      echo '#include <stdio.h>' > /poc/exploit.c
      echo '#include <stdlib.h>' >> /poc/exploit.c
      echo '#include <string.h>' >> /poc/exploit.c
      cat /poc/exploit_raw.c >> /poc/exploit.c
      echo '' >> /poc/exploit.c
      echo 'int main(int argc, char *argv[]) { puts("fragment loaded"); return 0; }' >> /poc/exploit.c
    fi
    INC="-I$PFX/include/libxml2 -I$PFX/include"
    rm -f /poc/exploit
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c $INC -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -lxml2 -lz -llzma -lm 2>&1 || \
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c $INC -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -lxml2 2>&1 || \
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c -lxml2 2>&1 || \
    gcc $M32 -O0 -g -w -o exploit exploit.c 2>&1 || \
    echo "compile failed"
    if [ -f /poc/exploit ]; then echo "SUCCESS"; file /poc/exploit; else echo "ERROR: failed to compile"; head -30 /poc/exploit.c; exit 1; fi
    for c in $POC_COMPANIONS; do
      stem="${c%.*}"
      case "$c" in
        *.c) ( gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" 2>&1 || echo "WARN: companion $c" ) ;;
        *.sh|*.py|*.pl|*.rb) chmod +x "/poc/$c" 2>/dev/null || true ;;
      esac
    done
    USES=no
    if LD_LIBRARY_PATH="$PFX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$PFX"; then USES=yes; fi
    echo "$USES" > /poc/.ssd_poc_uses_build; echo "poc_uses_project_build: $USES"

  # No project loader needed — default launch (direct run, LD_LIBRARY_PATH=$RUN_LIB) is correct.
  poc_launch_script: ""

  # ---- patch_rebuild_script — incremental make + markers ----
  patch_rebuild_script: |
    #!/bin/bash
    cd "$BUILD_DIR" || { echo "no build dir" > /tmp/ssd_rebuild.log; }
    make -j"$(nproc)" -k > /tmp/ssd_rebuild.log 2>&1; echo "rebuild exit: $?"; tail -30 /tmp/ssd_rebuild.log
    make install -k > /tmp/ssd_install.log 2>&1; echo "install exit: $?"
    grep -B2 -A8 "error:" /tmp/ssd_rebuild.log 2>/dev/null | head -100 > /tmp/ssd_build_errors; true
    case "$VULN_FILE" in
      *.c) OBJ="$(basename "$VULN_FILE" .c).o"; find "$BUILD_DIR" -name "$OBJ" -newer "$SOURCE_DIR/$VULN_FILE" -print -quit > /tmp/ssd_obj_rebuilt; echo "obj_rebuilt: $(cat /tmp/ssd_obj_rebuilt)" ;;
      *) echo skip > /tmp/ssd_obj_rebuilt ;;
    esac
    USES=no
    if LD_LIBRARY_PATH="$INSTALL_PREFIX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$INSTALL_PREFIX"; then USES=yes; fi
    echo "$USES" > /tmp/ssd_poc_uses_build; echo "poc_uses_build: $USES"

  build_system: "autotools"
  extra_configure_flags: []
