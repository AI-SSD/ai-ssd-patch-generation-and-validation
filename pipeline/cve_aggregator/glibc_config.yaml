# =============================================================================
# CVE Aggregator Pipeline – glibc Configuration
# =============================================================================
# Production configuration for the GNU C Library (glibc) project.
# Pass to the pipeline with:
#   python3 pipeline.py --phases 0 --phase0-config cve_aggregator/glibc_config.yaml
# (this is also the default Phase 0 config when no --phase0-config is given)
# =============================================================================

# ---------------------------------------------------------------------------
# Project identity (used in dataset names, logging, etc.)
# ---------------------------------------------------------------------------
project:
  name: "glibc"
  display_name: "GNU C Library"
  description: "CVE and PoC dataset for GNU C Library (glibc)"

# ---------------------------------------------------------------------------
# Pipeline behaviour
# ---------------------------------------------------------------------------
pipeline:
  abort_on_error: false          # Continue even if one module fails
  skip_modules: []

# ---------------------------------------------------------------------------
# Reproduction strategy — which CVE reproducer(s) to use, in PRIORITY order.
# One knob, all four modes (the first entry is the primary reproducer Phase 1
# uses; a later entry is the fallback for CVEs the first can't cover):
#   [exploitdb]            ExploitDB PoC only            (default — current glibc)
#   [intree]               fix-commit regression test only (Option A only)
#   [exploitdb, intree]    both, ExploitDB preferred     (PoC, else the test)
#   [intree, exploitdb]    both, Option A preferred      (test, else the PoC)
# "intree" needs this project's phase1.intree_test.{build_script,run_script}
# recipe (glibc has one). Supersedes commit_discovery.harvest_regression_tests.
# Flip to [exploitdb, intree] to add fix-commit-test coverage for the many CVEs
# with no public PoC.
# ---------------------------------------------------------------------------
reproduction_strategy:
  - exploitdb
  - intree

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/glibc_cve_aggregator.log"

# ---------------------------------------------------------------------------
# Module 1: CVE Fetching & Enrichment
# ---------------------------------------------------------------------------
cve_fetcher:
  # NVD API key – get one at https://nvd.nist.gov/developers/request-an-api-key
  nvd_api_key: "043bad81-616b-445a-8e79-96e87cc96c66"

  # Keywords used for NVD keyword search.
  # These are sent as ``keywordSearch`` to the NVD 2.0 API.
  keywords:
    - "glibc"
    - "GNU C Library"
    - "eglibc"

  # CPE match(es) — sent as ``virtualMatchString`` to the NVD 2.0 API. This
  # selects CVEs that NVD records as genuinely AFFECTING the product (with
  # version ranges), which is far more precise and complete than keyword search
  # (keywords also catch CVEs that merely mention glibc, and miss ones that
  # don't). Results are merged + de-duplicated with the keyword results. The CPE
  # string is the only project-specific bit; the pipeline code stays generic.
  cpe_match:
    - "cpe:2.3:a:gnu:glibc"

  # Strong keywords that MUST appear in a CVE description for it to be
  # considered relevant.  Used for deduplication filtering.
  strong_keywords:
    - "glibc"
    - "GNU C Library"
    - "GNU libc"
    - "eglibc"

  # If the description contains ONLY a weak match (e.g. a generic library
  # name), the presence of any of these strings causes the entry to be
  # rejected.  Useful to exclude look-alike projects.
  non_target_indicators:
    # BSD variants
    - "NetBSD"
    - "FreeBSD"
    - "OpenBSD"
    - "DragonflyBSD"
    # Apple / macOS
    - "Mac OS X"
    - "macOS"
    - "Apple"
    # Commercial Unix
    - "Solaris"
    - "SunOS"
    - "AIX"
    - "HP-UX"
    - "IRIX"
    # Alternative C libraries
    - "musl"
    - "dietlibc"
    - "uClibc"
    - "Bionic"
    # Pre-glibc Linux C library
    - "libc 5."
    - "libc5"
    # False-positive library names
    - "libcgi"
    - "libcrypt"
    - "libcurl"
    - "libcap"
    # Non-glibc GNU project false positives
    - "binutils"
    - "libbfd"
    - "libcdio"
    - "vmware"
    - "mupdf"
    - "jboss"
    # Non-glibc software that may reference glibc in CVE descriptions
    - "GoAhead"
    - "Embedthis"
    - "sudo"

  # Hardening knobs – require explicit glibc match in description and CPE.
  # strict_target_matching: require at least one strong keyword in description.
  # require_project_cpe_match: require a project alias in a CPE entry.
  strict_target_matching: true
  require_project_cpe_match: false
  project_cpe_aliases:
    - "glibc"
    - "gnu:glibc"
    - "eglibc"

  # Optionally enrich each CVE with CVE.org data (slower).
  enrich_with_cve_org: false
  cve_org_delay: 1.0             # Seconds between CVE.org requests

  # Exclude CVEs published before this year (commits predate git history).
  # Set to null or remove to include all years.
  min_published_year: 1990

# ---------------------------------------------------------------------------
# Module 2: Commit Discovery
# ---------------------------------------------------------------------------
commit_discovery:
  # Remote URL of the source repository (will be cloned if not present)
  repo_url: "https://sourceware.org/git/glibc.git"

  # Local path to the cloned repository (relative to CWD or absolute).
  # Cloned as a sibling of the pipeline directory (one level up) so the ~1.5 GB
  # checkout survives between runs/deploys that reset the pipeline directory
  # (mirrors poc_mapper.exploitdb_path, which persists for the same reason).
  repo_local_path: "../glibc"

  # Timeout (seconds) for the initial git clone.
  # The glibc repo is ~1.5 GB; sourceware.org can be slow.
  clone_timeout: 3600

  # Option A — harvest the regression test each fixing commit ships and use it as
  # an in-tree reproducer (poc_language="intree-test"). Set false to disable, so
  # Phase 1 depends ONLY on PoC reproducers (ExploitDB) + NVD-discovered CVEs.
  # Trade-off: false drops reproducible glibc CVEs from ~56 to ~9-10 (few glibc
  # CVEs have public PoCs). Flip back to true to re-enable; no code change needed.
  harvest_regression_tests: false

  # Pull latest changes before searching?
  auto_update: true

  # Additional git-grep patterns to try when searching for fix commits.
  # The pipeline always searches for CVE-ID and CVE-ID-without-dashes.
  # Use {cve} or {cve_num} placeholders to scope a pattern to the current CVE.
  extra_grep_patterns: []

  # Optional safety knobs for commit matching:
  # - enable_bz_fallback: when the commit message doesn't name the CVE, look up
  #   the REAL Bugzilla id(s) from this CVE's NVD references and match commits
  #   that cite them. (The old behaviour — treating the CVE's own number as a
  #   Bugzilla number — was unsound and was removed; this is now safe to leave on.)
  # - allow_unscoped_extra_patterns: if false, plain patterns without {cve}/{cve_num} are ignored
  enable_bz_fallback: true
  allow_unscoped_extra_patterns: false

  # Native bug-tracker host(s) for THIS project. Only bug ids from these hosts
  # are matched against the repo's "[BZ #NNNN]" commits; ids from cross-vendor
  # distro trackers (bugzilla.redhat.com, …) live in a different namespace and
  # are ignored. glibc's tracker is sourceware. Leave empty to fall back to a
  # built-in foreign-tracker denylist.
  bugzilla_hosts:
    - "sourceware.org"

  # Opt-in NETWORK step (default off): for CVEs whose only bug reference is a
  # distro tracker (e.g. Red Hat) and whose fix commit never names the CVE id,
  # follow the Red Hat Bugzilla REST API to the upstream (sourceware) bug id and
  # find its fix commit. Recovers otherwise-undiscoverable old CVEs
  # (e.g. CVE-2010-3856 / CVE-2010-4052) at the cost of a network call per CVE.
  enable_online_bug_resolution: true

  # File extensions considered as "source code" for content extraction
  source_extensions:
    - ".c"
    - ".h"

# ---------------------------------------------------------------------------
# Module 3: PoC Mapping & Extraction (ExploitDB)
# ---------------------------------------------------------------------------
poc_mapper:
  # Local path to the ExploitDB git repository.
  # Cloned as a sibling to the pipeline directory (one level up).
  exploitdb_path: "../exploit-database"

  # Remote URL (for auto-clone)
  exploitdb_remote_url: "https://gitlab.com/exploit-database/exploitdb.git"

  # Pull latest ExploitDB data before mapping?
  auto_update: true

  # Deep search: grep exploit file *contents* for CVE IDs (slower but thorough)
  deep_search: false

  # Extract full source code from matched exploit files?
  extract_content: true

  # Reverse search: scan ExploitDB titles/contents for your project's
  # keywords to discover CVEs not returned by NVD keyword search.
  reverse_search: true
  enable_reverse_content_grep: false

  # Only include verified exploits from ExploitDB?
  # Set to false to also include unverified community-contributed PoCs
  # (increases recall at the cost of lower quality assurance).
  require_verified: true

  # Preferred ExploitDB platform tokens, most-preferred first. The primary PoC
  # (index 0, the one Phase 1 compiles) is chosen from the highest-ranked
  # matching platform, so a Linux/glibc pipeline prefers linux exploits over
  # osx/bsd/multiple variants (which may include non-Linux headers like
  # sys/event.h that cannot compile here). Matching is case-insensitive
  # substring, so "linux" also matches "linux_x86-64" / "linux_x86". Leave empty
  # to disable platform-aware ordering. Project-agnostic: set per target.
  prefer_platforms:
    - "linux"

  # Indicators that an exploit mentioning glibc is actually about
  # something else (same idea as cve_fetcher.non_target_indicators).
  non_target_indicators:
    - "NetBSD"
    - "FreeBSD"
    - "musl"

# ---------------------------------------------------------------------------
# Module 4: Data Aggregator
# ---------------------------------------------------------------------------
data_aggregator:
  # Path to the global (all-CVEs) JSON dataset
  global_json_path: "results/glibc_cve_poc_map.json"

  # When true, remove CVEs from the persisted dataset that are not present
  # in the current run's raw_cves set.
  prune_missing_cves: true

# ---------------------------------------------------------------------------
# Module 5: Syntax Validation
# ---------------------------------------------------------------------------
syntax_validator:
  # Directory where invalid PoC files are copied for manual review
  manual_supervision_dir: "manual_supervision"

  # Path for the JSON validation report
  report_path: "results/syntax_validation_report.json"

  # When false, only PoCs belonging to CVEs that have an associated fix
  # commit are flagged for manual review (avoids reviewing unreachable PoCs).
  allow_manual_without_commit: false

# ---------------------------------------------------------------------------
# Module 6: LLM PoC Repair
# ---------------------------------------------------------------------------
# Attempts to auto-fix invalid PoCs using an LLM before flagging for manual
# review.  Supports "ollama" (local GPU server) or "openai" (OpenAI API).
poc_repair:
  # Backend provider: "ollama" or "openai"
  provider: "openai"

  # -- OpenAI settings (used only when provider: "openai") --
  # Model to use.  gpt-4.1-mini is a non-reasoning model with a 10 M token/day
  # free tier – well suited for code generation tasks.
  openai_model: "gpt-4.1-mini"
  # API key. The OPENAI_API_KEY environment variable takes precedence.
  # Do NOT commit a real key here; prefer the environment variable.
  # Instead as a possibility, do something like: export OPENAI_API_KEY="$(cat /path/to/secret/key.txt)"
  openai_api_key: ""

  # -- Ollama settings (used only when provider: "ollama") --
  # Ollama-compatible chat API endpoint
  api_endpoint: "http://10.3.2.171:80/api/chat"

  # LLM model to use for repairs (must be available on the Ollama server).
  # devstral is faster than qwen3-coder:30b and code-repair specialised.
  model: "devstral:32k"

  # Maximum number of repair attempts per PoC before flagging for manual review
  max_repair_attempts: 3

  # ACTIVE per-attempt model escalation (provider: openai). Attempt 1 uses the
  # base gpt-4.1-mini; failures escalate to stronger models on retries.
  models_by_attempt:
    1: "gpt-4.1-mini"        # first repair
    2: "gpt-5.4-mini"          # 1st retry — escalate
    3: "gpt-4.1"             # 2nd retry — escalate again

  # Per-attempt model escalation (optional) — mirrors Phase 2's
  # feedback_loop.models_by_attempt. Keys are ATTEMPT numbers, values model ids:
  #   1 = first repair, 2 = first retry, 3 = second retry, …
  # The idea: if the first repair fails validation, retry with a stronger model,
  # escalating further on each subsequent failure. An attempt number not listed
  # falls back to the base model for the active `provider` above. Leave empty /
  # commented to use the base model for every attempt.
  #
  # PROVIDER-AGNOSTIC: the ids are passed straight to whatever backend `provider`
  # selects — use OpenAI ids with provider: openai, or Ollama/local model tags
  # with provider: ollama (any model family). Set ids your provider can actually
  # serve — an unknown id makes that attempt fail gracefully and the loop moves on.
  #
  # DUAL ROLE (provider: ollama): this same ordered list is also the
  # context-window fallback ramp. If a PoC's repair prompt does not fit the
  # current model's context window, repair advances to the next (larger-context)
  # model in this list instead of silently truncating the PoC — so size the list
  # ascending by context window as well as capability. No-op for provider:
  # openai (its windows are large enough that this never triggers).
  #
  # Example for provider: openai
  # models_by_attempt:
  #   1: "gpt-4.1-mini"        # first repair
  #   2: "gpt-5-mini"          # 1st retry — escalate
  #   3: "gpt-4.1"             # 2nd retry — escalate again
  #
  # Example for provider: ollama
  # models_by_attempt:
  #   1: "qwen2.5-coder:7b"    # first repair
  #   2: "devstral:32k"        # 1st retry — escalate
  #   3: "qwen3-coder:30b"     # 2nd retry — escalate again

  # Timeout for each LLM API call (seconds).
  # Cold-start model loading is handled by model_load_timeout (see below);
  # this only covers the actual inference once the model is in VRAM.
  # At ~2-3 tok/s (no flash attention) generating 1000 tokens takes ~6 min.
  # With flash attention enabled (recommended) this can be lowered to 300.
  api_timeout: 600

  # Max seconds to wait for the model to load into GPU VRAM before
  # starting repairs.  Ollama lazy-loads on first inference, so large models
  # (devstral ~14 GiB) can exceed api_timeout on the very first call.
  model_load_timeout: 300

  # Ollama context window size passed as options.num_ctx in the API call.
  # Must be large enough to hold the full prompt + response tokens.
  # Prompts with PoC source typically range from 4K-15K tokens.
  # If set to 0, Ollama falls back to its server default (often 4096),
  # which SILENTLY TRUNCATES the prompt and causes 500 errors.
  num_ctx: 32768

  # Maximum characters of PoC source code included in the prompt.
  # 0 = no truncation (recommended when running on GPU with sufficient VRAM).
  # NOTE: with provider: ollama the context-window ramp (see models_by_attempt)
  # is the preferred way to handle oversized PoCs — it advances to a
  # larger-context model instead of truncating. Leave this at 0 unless you must.
  max_poc_chars: 0

  # Estimated local generation speed (tokens/sec), used ONLY by the pre-flight
  # "too slow to repair within api_timeout" skip (provider: ollama). The default
  # 3 tok/s is a conservative CPU-only figure: at that rate any PoC larger than
  # ~api_timeout*0.8*rate output tokens is routed to manual review BEFORE the
  # repair loop — which also pre-empts the context-window ramp on large PoCs.
  # Set this to your GPU's real throughput (e.g. 30-100) so the ramp can engage.
  local_token_rate: 3
  # Same estimate for the OpenAI provider; openai windows are large so the
  # context ramp is a no-op there and only this time gate applies.
  openai_token_rate: 150

  # Sampling temperature for the LLM.
  # Base temperature – the code staggers it upward on each retry.
  temperature: 0.4

  # Output paths
  report_path: "results/poc_repair_report.json"
  manual_review_queue_path: "results/manual_review_queue.json"

  # GPU availability wait timeout (seconds).
  # Before starting repairs, poll /api/ps until a GPU is free.
  # If the GPU is still busy after this many seconds, skip repairs entirely.
  # Set to 0 to disable the check and always proceed.
  gpu_wait_timeout: 120

# ---------------------------------------------------------------------------
# Module 7: Output Generation
# ---------------------------------------------------------------------------
output:
  # JSON output paths
  global_json_path: "results/glibc_cve_poc_map.json"
  filtered_json_path: "results/glibc_cve_poc_map_filtered.json"

  # CSV output
  csv_path: "results/glibc_cve_poc_complete.csv"

  # Directory for saving individual PoC exploit files
  poc_dir: "exploits"

  # Filter controls for the "filtered" dataset:
  # - filtered_require_commit: keep only CVEs with discovered fix commits
  # - filtered_require_poc: keep only CVEs with at least one mapped PoC
  # - filtered_require_verified_poc: require at least one PoC flagged as
  #   verified in ExploitDB (mirrors poc_mapper.require_verified for output)
  filtered_require_commit: false
  filtered_require_poc: true
  filtered_require_verified_poc: true

  # When a CVE has a fix commit + extracted vulnerable functions AND a verified
  # ExploitDB entry, but that entry fails runnability validation (a prose
  # write-up that links to the real PoC, e.g. EDB-39454/CVE-2015-7547), route it
  # to Phase 0 manual supervision instead of silently discarding it: a CSV row is
  # emitted with manual_review_required=yes / manual_verified=pending and a report
  # is written to manual_supervision/ pointing at the ExploitDB lead so a human
  # can supply the real PoC. Phase 1 skips it until approved. Set false to revert
  # to discard-on-no-runnable-PoC.
  flag_unvalidated_edb_for_manual_review: true

  # Directory for manual-supervision reports/markers (mirrors
  # syntax_validator.manual_supervision_dir; both must point at the same place).
  manual_supervision_dir: "manual_supervision"

  # Export PoC rows/files even when commit discovery failed.
  # Useful for PoC inventory workflows; disable for strict patch-pipeline-only mode.
  allow_poc_without_commit: false

  # CSV column names (order matters)
  csv_fields:
    - "CVE"
    - "V_COMMIT"
    - "FilePath"
    - "F_NAME"
    - "UNIT_TYPE"
    - "V_FILE"
    - "V_FUNCTION"
    - "CVE_Description"
    - "CWE"
    - "CWE_Description"
    - "project_version"
    - "project_version_normalized"
    - "ubuntu_version"
    - "poc_index"
    - "poc_path"
    - "poc_language"
    # Option A (in-tree regression-test PoCs): the fixing commit + the test's
    # in-repo path, used by Phase 1 to overlay and run the test. Empty for
    # ordinary ExploitDB PoCs. MUST be listed here — this csv_fields list
    # overrides the code default, so omitting them drops the columns.
    - "FIX_COMMIT"
    - "TEST_PATH"
    - "TEST_SUBDIR"
    - "manual_review_required"
    - "manual_verified"

# ---------------------------------------------------------------------------
# Phase 2 (patch_generator.py) – LLM patch generation (project/language-specific)
# ---------------------------------------------------------------------------
# The pipeline code carries only GENERIC defaults; the project supplies the
# language framing here. `language` gates host-side validation (c → gcc syntax
# check; anything else → structural brace check only, since the real compile
# gate is Phase 3's in-container rebuild). `system_prompt`/`feedback_system_prompt`
# are the ROLE PREAMBLE only — the pipeline appends the fixed SEARCH/REPLACE edit
# format (the parser contract) and, for feedback, the failure-analysis tail.
# `internal_headers` are project-internal headers absent host-side; the generic
# `fatal error: *.h` regex is the primary arbiter, so this list is belt-and-braces.
phase2:
  language: "c"
  system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for the GNU C Library (glibc). Your task is to fix a security vulnerability by
    making the SMALLEST POSSIBLE EDIT to the vulnerable function — never by
    rewriting it.
  feedback_system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for the GNU C Library (glibc). Your previous patch attempt FAILED validation.
    Analyze the failure and produce an improved fix as MINIMAL edits — never
    rewrite the whole function.
  internal_headers:
    - "kernel-features.h"
    - "xlocale.h"
    - "bits/libc-lock.h"
    - "kernel_stat.h"
    - "libc-symbols.h"
    - "shlib-compat.h"
    - "bp-sym.h"
    - "bp-asm.h"
    - "sysdep.h"
    - "tls.h"
    - "lowlevellock.h"
    - "ldsodefs.h"
    - "dl-hash.h"
    - "math_private.h"
    - "math_ldbl_opt.h"
    - "ieee754.h"
    - "fenv_private.h"
    - "locale/localeinfo.h"
    - "localeinfo.h"
    - "setlocale.h"
    - "ctype/ctype.h"
    - "gconv_int.h"
    - "iconvconfig.h"
    - "elf/ldsodefs.h"
    - "dl-machine.h"
    - "nss/nss.h"
    - "nss.h"
    - "resolv/resolv-internal.h"
    - "resolv-internal.h"
    - "arpa/nameser_compat.h"
    - "hp-timing.h"
    - "atomic.h"
    - "unwind.h"
    - "stackinfo.h"
    - "dl-sysdep.h"
    - "not-cancel.h"
    - "kernel-posix-timers.h"
    - "pthread-functions.h"
    - "nptl/pthreadP.h"
    - "pthreadP.h"
    - "fork.h"
    - "stdio-common/printf-parse.h"
    - "printf-parse.h"
    - "libioP.h"

# ---------------------------------------------------------------------------
# Phase 3 (patch_validator.py) – SAST (static analysis) tooling
# ---------------------------------------------------------------------------
# Project-/language-specific: glibc is C, so it uses C/C++ analysers. A Java
# project would instead list e.g. spotbugs/semgrep here with parser: sarif.
# The pipeline code is tool-agnostic — it only knows how to *run* a command and
# *parse* one of the supported output formats. Consumed by patch_validator.py,
# the startup preflight, and setup/verify_setup.sh (via master_pipeline.sast_config).
#
#   parser: one of  cppcheck-xml | flawfinder | sarif | regex
#   install: how setup.sh installs it (apt | pip | script: <shell command>)
#   {file}   -> the patched source file        {python} -> the running interpreter
#
# Tool selection (C). SAST runs host-side on a single patched source file with
# NO build, so only source-level analysers fit. Whole-program/build-coupled
# tools (CodeQL, Infer) are intentionally excluded — they need a compiled
# database. The stack mixes a maintained classic (cppcheck) with modern
# analysers (clang-tidy = LLVM static analyser, semgrep = AST security rules):
#   - cppcheck   : actively maintained (kept; apt ships <2.16 so XML, not SARIF)
#   - clang-tidy : LLVM clang-analyzer / bugprone / cert checks
#   - semgrep    : modern multi-language AST scanner, SARIF native
#   - flawfinder : lightweight lexical CWE pass (kept for continuity; weakest)
sast:
  enabled: true
  fail_on: [critical, high]      # severity classes that fail a patch (medium/low are reported only)
  tool_timeout: 180              # per-tool subprocess timeout (seconds); semgrep fetches rules
  tools:
    - name: cppcheck
      detect: cppcheck
      cmd: ["cppcheck", "--enable=all", "--xml", "--xml-version=2", "{file}"]
      parser: cppcheck-xml
      install: { apt: cppcheck }
    - name: clang-tidy
      detect: clang-tidy
      # No compile DB: the trailing "--" runs the checks directly. The regex only
      # matches real check diagnostics (trailing "[check-name]"), so missing-header
      # parse errors on stderr are ignored rather than counted as findings.
      cmd: ["clang-tidy", "--quiet", "--checks=clang-analyzer-*,bugprone-*,cert-*", "{file}", "--"]
      parser: regex
      regex: '^(.+?):(\d+):(\d+):\s+(warning|error):\s+(.+?)\s+\[([^\]]+)\]$'
      groups: { file: 1, line: 2, column: 3, severity: 4, message: 5, rule: 6 }
      severity_map: { warning: medium, error: high }
      install: { apt: clang-tidy }
    - name: semgrep
      detect: semgrep
      # p/c = Semgrep registry C ruleset (downloaded at scan time → needs network;
      # for fully offline/deterministic runs, vendor semgrep-rules and point
      # --config at a local path instead). Avoid --config=auto (requires login).
      cmd: ["semgrep", "scan", "--sarif", "--quiet", "--metrics=off", "--config=p/c", "{file}"]
      parser: sarif
      install: { pip: semgrep }
    - name: flawfinder
      detect: flawfinder
      cmd: ["flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      fallback_cmd: ["{python}", "-m", "flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      parser: flawfinder
      install: { pip: flawfinder }

# ---------------------------------------------------------------------------
# Phase 1 (orchestrator.py) – project-specific settings
# ---------------------------------------------------------------------------
# All values here are read by orchestrator.py at startup via --phase0-config.
# Changing these keys is the ONLY thing needed to adapt Phase 1 to a new project.
phase1:
  # Local path to the project source repository (relative to pipeline base_dir).
  # Kept as a sibling of the pipeline directory (one level up) so the checkout
  # persists across runs/deploys — must match commit_discovery.repo_local_path.
  project_repo_local_path: "../glibc"

  # Remote URL used to clone the repo when it is absent locally
  project_repo_remote_url: "https://sourceware.org/git/glibc.git"

  # Docker image tag prefixes (must be valid Docker image name components)
  docker_base_image_prefix: "ai-ssd/glibc-base"
  docker_cve_image_prefix: "ai-ssd/glibc-cve"

  # Path (relative to base_dir) where the image manifest JSON is written
  image_manifest_path: "results/image_manifest.json"

  # ---- Base image packages (PROJECT-SUPPLIED; pipeline only hardcodes git) ----
  # base_packages: required — the base-image build FAILS if any can't install.
  # base_packages_optional: best-effort (a 404 on an EOL mirror is non-fatal).
  # base_setup: post-install shell hook (extra arch, locale generation, …),
  # run best-effort. These replace the formerly hardcoded glibc apt list so the
  # pipeline carries no project-specific packages (tomcat/kernel set their own).
  base_packages:
    - build-essential
    - gawk
    - bison
  base_packages_optional:
    - texinfo
    - autoconf
    - libtool
    - gettext
    - wget
    - python3
    - locales
    - linux-headers-generic
    - linux-libc-dev
    - gcc-multilib
    - g++-multilib
  base_setup: |
    dpkg --add-architecture i386 && apt-get update && apt-get install -y libc6-dev-i386 libc6-i386 || true
    locale-gen en_US en_US.UTF-8 en_GB en_GB.UTF-8 de_DE de_DE.UTF-8 fr_FR fr_FR.UTF-8 es_ES es_ES.UTF-8 it_IT it_IT.UTF-8 ja_JP.UTF-8 zh_CN.UTF-8 ru_RU.UTF-8 C.UTF-8 POSIX || true

  # ---- Standard-PoC build recipe (PROJECT-SUPPLIED) ----
  # How to build the project at the checked-out (vulnerable) commit, for the
  # standard ExploitDB-PoC path. The pipeline checks out the commit and exports
  # the env contract (SOURCE_DIR, BUILD_DIR, INSTALL_PREFIX, COMMIT_HASH,
  # BUILD_ARCH); this script does the build. No build commands live in the
  # pipeline code. (glibc: multi-strategy configure + make + install + locale-gen
  # + era compat fixes; BUILD_ARCH=i386 forces the 32-bit toolchain.)
  build_script: |
    #!/bin/bash
    SRC="$SOURCE_DIR"; BD="$BUILD_DIR"; PFX="$INSTALL_PREFIX"
    CCBASE="gcc"; ARCHCFLAGS=""; HOSTFLAGS=""
    if [ "$BUILD_ARCH" = "i386" ]; then
      CCBASE="gcc -m32"; ARCHCFLAGS="-m32"
      HOSTFLAGS="--host=i686-linux-gnu --build=i686-linux-gnu"
    fi
    # relax old configure version gates (newer binutils/sed rejected as "too old")
    sed -i 's/test -n "$critic_missing"/false/g; s/test "x$critic_missing" != x/false/g' "$SRC/configure" 2>/dev/null || true
    # _begin linker-script compat for old trees (binutils >= 2.21)
    if grep -q 'GL(dl_rtld_map).l_map_start = (ElfW(Addr)) _begin;' "$SRC/elf/rtld.c" 2>/dev/null; then
      sed -i -e 's|GL(dl_rtld_map).l_map_start = (ElfW(Addr)) _begin;|GL(dl_rtld_map).l_map_start = (ElfW(Addr)) GL(dl_rtld_map).l_addr;|' \
             -e 's|= (ElfW(Ehdr) \*) \&_begin;|= (ElfW(Ehdr) *) bootstrap_map.l_addr;|' "$SRC/elf/rtld.c" && echo "Applied _begin compat fix"
    fi
    cd "$BD"; rm -rf ./*
    echo "=== Strategy 1: full configure ==="
    ( "$SRC"/configure --prefix="$PFX" --disable-werror --disable-sanity-checks --disable-profile --enable-obsolete-rpc $HOSTFLAGS \
        CC="$CCBASE -fno-stack-protector -fgnu89-inline" CFLAGS="$ARCHCFLAGS -O2 -g -fno-stack-protector -Wno-error -w -U_FORTIFY_SOURCE" 2>&1 && echo CONFIGURE_OK ) \
    || ( echo "=== Strategy 2: minimal ==="; rm -rf ./*; "$SRC"/configure --prefix="$PFX" --disable-werror --disable-sanity-checks --disable-profile --disable-nscd --disable-timezone-tools --without-selinux --without-cvs --without-gd $HOSTFLAGS \
        CC="$CCBASE -fgnu89-inline" CFLAGS="$ARCHCFLAGS -O1 -g -w -U_FORTIFY_SOURCE -fno-stack-protector -Wno-error" 2>&1 && echo CONFIGURE_OK ) \
    || ( echo "=== Strategy 3: bare ==="; rm -rf ./*; "$SRC"/configure --prefix="$PFX" --disable-werror --disable-sanity-checks --disable-profile --disable-build-nscd --disable-nscd $HOSTFLAGS \
        CC="$CCBASE" CFLAGS="$ARCHCFLAGS -O0 -g -w -U_FORTIFY_SOURCE -fno-stack-protector -Wno-error -std=gnu99 -fgnu89-inline -fno-strict-aliasing" 2>&1 && echo CONFIGURE_OK ) \
    || ( echo "=== All configure strategies failed ==="; grep -iE "error|fail|cannot|not found|unsupported" config.log 2>/dev/null | tail -20; tail -50 config.log 2>/dev/null; exit 1 )
    make -j"$(nproc)" -k > /build/make.log 2>&1; echo "PROJECT_BUILD_EXIT_CODE=$?" >> /build/build_status; tail -20 /build/make.log
    make install -k > /build/make_install.log 2>&1; echo "PROJECT_INSTALL_EXIT_CODE=$?" >> /build/build_status
    if ls "$PFX"/lib/libc.so.6 >/dev/null 2>&1 || ls "$BD"/libc.so >/dev/null 2>&1; then echo "PROJECT_BUILD_INSTALLED=yes" >> /build/build_status; else echo "PROJECT_BUILD_INSTALLED=no" >> /build/build_status; fi
    # locale-gen via the build's OWN localedef (locale-dependent PoCs)
    if [ -x "$PFX/bin/localedef" ]; then
      mkdir -p "$PFX/lib/locale"; I18N="$SRC/localedata"
      for loc in en_US en_GB de_DE fr_FR es_ES it_IT ja_JP zh_CN ru_RU C; do I18NPATH=$I18N "$PFX/bin/localedef" -i $loc -f UTF-8 $loc.UTF-8 2>/dev/null || true; done
      for loc in en_US en_GB de_DE fr_FR; do I18NPATH=$I18N "$PFX/bin/localedef" -i $loc -f ISO-8859-1 $loc.ISO-8859-1 2>/dev/null || true; done
    fi
    echo "build complete"

  # ---- C PoC compile/link recipe (PROJECT-SUPPLIED) ----
  # The ONLY place PoC compiler/link commands live. Run as poc_prepare.sh in the
  # CVE image for compiled (C) PoCs. The pipeline stages the primary PoC at
  # /poc/exploit_raw.c (+ any alternatives/companions in /poc) and exports:
  #   INSTALL_PREFIX, BUILD_ARCH  (from the image header)
  #   POC_ALTS        space-separated alternative PoC filenames in /poc
  #   POC_COMPANIONS  space-separated companion/helper filenames in /poc
  # It MUST produce /poc/exploit and write /poc/.ssd_poc_uses_build (yes|no), the
  # honesty marker Phase 1/3 read (does the PoC resolve the project libc at run
  # time). Faithful port of the former hardcoded CVE_DOCKERFILE_C chain: fragment
  # main()-wrap, i386 inline-asm detection, 5-strategy link against the build
  # glibc, alternative-PoC fallback, companion build, then the honesty probe.
  # i386 builds prefix gcc with -m32 via $BUILD_ARCH. Exit non-zero only when NO
  # exploit could be produced (that fails the image build = unrunnable PoC).
  poc_prepare_script: |
    #!/bin/bash
    PFX="$INSTALL_PREFIX"
    M32=""; [ "$BUILD_ARCH" = "i386" ] && M32="-m32"
    cd /poc

    # Wrap a code-fragment PoC (no main()) in a harness.
    if grep -qE '^[[:space:]]*(int|void)?[[:space:]]*main[[:space:]]*\(' /poc/exploit_raw.c; then
      echo "PoC has main() - using as-is"; cp /poc/exploit_raw.c /poc/exploit.c
    else
      echo "WARNING: PoC missing main() - wrapping in test harness"
      echo '/* Auto-generated wrapper for PoC code fragment */' > /poc/exploit.c
      echo '#include <stdio.h>' >> /poc/exploit.c
      echo '#include <stdlib.h>' >> /poc/exploit.c
      echo '#include <string.h>' >> /poc/exploit.c
      echo '#include <unistd.h>' >> /poc/exploit.c
      echo '' >> /poc/exploit.c
      cat /poc/exploit_raw.c >> /poc/exploit.c
      echo '' >> /poc/exploit.c
      echo 'int main(int argc, char *argv[]) {' >> /poc/exploit.c
      echo '    puts("PoC code fragment loaded - vulnerability path exists in binary");' >> /poc/exploit.c
      echo '    return 0;' >> /poc/exploit.c
      echo '}' >> /poc/exploit.c
    fi

    # i386 inline-asm → install 32-bit dev libs.
    if grep -qE 'int \$0x80|%eax|%ebx|%ecx|%edx|%esi|%edi|%esp|%ebp' /poc/exploit.c 2>/dev/null; then
      echo "Detected i386 inline assembly — installing 32-bit development libraries"
      dpkg --add-architecture i386 && apt-get update -qq && apt-get install -y gcc-multilib libc6-dev-i386 2>/dev/null || true
    fi

    DYNAMIC_LINKER=$(find "$PFX"/lib -name 'ld-linux*.so*' -o -name 'ld-*.so*' 2>/dev/null | head -1)
    rm -f /poc/exploit
    echo "=== Compilation Strategy 1: Link against vulnerable glibc (all libs) ==="
    if [ -n "$DYNAMIC_LINKER" ] && [ -f "$DYNAMIC_LINKER" ]; then
      gcc $M32 -o exploit exploit.c -Wl,-rpath,"$PFX"/lib -Wl,--dynamic-linker=$DYNAMIC_LINKER -L"$PFX"/lib -I"$PFX"/include -ldl -lpthread -lm -lrt 2>&1 ||
      gcc $M32 -o exploit exploit.c -Wl,-rpath,"$PFX"/lib -Wl,--dynamic-linker=$DYNAMIC_LINKER -L"$PFX"/lib -I"$PFX"/include -ldl -lpthread 2>&1 ||
      gcc $M32 -o exploit exploit.c -Wl,-rpath,"$PFX"/lib -Wl,--dynamic-linker=$DYNAMIC_LINKER -L"$PFX"/lib -I"$PFX"/include -ldl 2>&1 ||
      gcc $M32 -o exploit exploit.c -Wl,-rpath,"$PFX"/lib -Wl,--dynamic-linker=$DYNAMIC_LINKER -L"$PFX"/lib -I"$PFX"/include 2>&1 ||
      echo "Vulnerable glibc linking failed, trying relaxed flags..."
    fi
    if [ ! -f /poc/exploit ] && [ -n "$DYNAMIC_LINKER" ] && [ -f "$DYNAMIC_LINKER" ]; then
      echo "=== Compilation Strategy 2: Relaxed flags (-w -fpermissive) ==="
      gcc $M32 -o exploit exploit.c -w -fpermissive -Wl,-rpath,"$PFX"/lib -Wl,--dynamic-linker=$DYNAMIC_LINKER -L"$PFX"/lib -I"$PFX"/include -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 ||
      echo "Relaxed compilation also failed"
    fi
    if [ ! -f /poc/exploit ]; then
      echo "=== Compilation Strategy 3: System glibc ==="
      gcc $M32 -o exploit exploit.c -ldl -lpthread -lm -lrt 2>&1 ||
      gcc $M32 -o exploit exploit.c -ldl -lpthread 2>&1 ||
      gcc $M32 -o exploit exploit.c -ldl -lm 2>&1 ||
      gcc $M32 -o exploit exploit.c -ldl 2>&1 ||
      gcc $M32 -o exploit exploit.c -lm 2>&1 ||
      gcc $M32 -o exploit exploit.c 2>&1 ||
      gcc $M32 -o exploit exploit.c -w -fpermissive -D_GNU_SOURCE 2>&1 ||
      echo "System glibc compilation also failed"
    fi
    if [ ! -f /poc/exploit ]; then
      echo "=== Compilation Strategy 4: C99/GNU99 mode ==="
      gcc $M32 -std=gnu99 -o exploit exploit.c -w -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 ||
      gcc $M32 -std=gnu99 -o exploit exploit.c -w -D_GNU_SOURCE 2>&1 ||
      echo "All C99/GNU99 strategies exhausted"
    fi
    if [ ! -f /poc/exploit ] && { which gcc-multilib >/dev/null 2>&1 || dpkg -l gcc-multilib 2>/dev/null | grep -q ^ii; }; then
      echo "=== Compilation Strategy 5: 32-bit (-m32) for i386 PoCs ==="
      gcc -m32 -o exploit exploit.c -w -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 ||
      gcc -m32 -o exploit exploit.c -w -D_GNU_SOURCE -ldl -lpthread 2>&1 ||
      gcc -m32 -o exploit exploit.c -w -D_GNU_SOURCE -ldl 2>&1 ||
      gcc -m32 -o exploit exploit.c -w -D_GNU_SOURCE 2>&1 ||
      gcc -m32 -std=gnu99 -o exploit exploit.c -w -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 ||
      echo "32-bit compilation also failed"
    fi

    # Alternative-PoC fallback: if the primary didn't compile, try each in turn.
    if [ ! -f /poc/exploit ]; then
      echo "Primary PoC failed to compile — trying alternatives..."
      for alt in $POC_ALTS; do
        echo "=== Trying alternative PoC: $alt ==="
        cp "/poc/$alt" /poc/exploit.c
        gcc $M32 -o /poc/exploit /poc/exploit.c -w -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 ||
        gcc $M32 -o /poc/exploit /poc/exploit.c -w -D_GNU_SOURCE -ldl -lpthread 2>&1 ||
        gcc $M32 -o /poc/exploit /poc/exploit.c -w -D_GNU_SOURCE -ldl 2>&1 ||
        gcc $M32 -o /poc/exploit /poc/exploit.c -w -D_GNU_SOURCE 2>&1 ||
        gcc -m32 -o /poc/exploit /poc/exploit.c -w -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 ||
        gcc $M32 -std=gnu99 -o /poc/exploit /poc/exploit.c -w -D_GNU_SOURCE -ldl -lpthread -lm 2>&1 || true
        [ -f /poc/exploit ] && { echo "SUCCESS: Compiled alternative PoC"; break; }
      done
    fi

    if [ -f /poc/exploit ]; then
      echo "SUCCESS: Exploit binary created"; file /poc/exploit
    else
      echo "ERROR: Failed to compile exploit!"
      echo "=== Source file head ==="; head -30 /poc/exploit.c
      echo "=== Verbose compilation attempt ==="; gcc $M32 -v -o exploit exploit.c -w 2>&1 || true
      exit 1
    fi

    # Companion/helper files (multi-file PoCs): build C/C++ to same-stem binaries,
    # make scripts executable. A failed helper is a soft warning.
    for c in $POC_COMPANIONS; do
      stem="${c%.*}"
      case "$c" in
        *.c)   ( gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" -ldl -lpthread -lm 2>&1 || gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" 2>&1 || echo "WARN: companion $c failed to build" ) ;;
        *.cpp|*.cc|*.cxx|*.c++) ( g++ -O0 -g -w -o "/poc/$stem" "/poc/$c" 2>&1 || echo "WARN: companion $c failed to build" ) ;;
        *.sh|*.py|*.pl|*.rb) chmod +x "/poc/$c" 2>/dev/null || true ;;
      esac
    done

    # Honesty marker: run the PoC through the project loader and confirm it maps
    # the project libc (LD_LIBRARY_PATH ldd fallback). Keep in sync with the Phase
    # 3 marker + read_poc_uses_build().
    LOADER=$(find "$PFX"/lib -maxdepth 1 -name 'ld-*.so*' 2>/dev/null | head -1)
    USES=no
    if [ -n "$LOADER" ] && "$LOADER" --library-path "$PFX"/lib --list /poc/exploit 2>/dev/null | grep -q "$PFX"; then USES=yes
    elif LD_LIBRARY_PATH="$PFX"/lib ldd /poc/exploit 2>/dev/null | grep -q "$PFX"; then USES=yes; fi
    echo "$USES" > /poc/.ssd_poc_uses_build
    echo "poc_uses_project_build: $USES"

  # ---- Compiled-PoC LAUNCH recipe (PROJECT-SUPPLIED) ----
  # Baked into the Phase 1 run wrapper for compiled (C) PoCs. Decides HOW to
  # execute /poc/exploit so it exercises the project glibc. Inputs: $RUN_LIB
  # (= install_prefix/lib). Outputs (consumed by the generic wrapper):
  #   SSD_EXEC_PREFIX       launch prefix prepended to ./exploit ("" = run directly)
  #   SSD_LD_LIBRARY_PATH   LD_LIBRARY_PATH for the run (pre-set to $RUN_LIB)
  # glibc runs the PoC through the project's OWN ld.so (--library-path) so the
  # freshly-built loader+libc are always exercised — UNLESS the binary's ELF
  # interpreter (PT_INTERP) already points into the project build, in which case
  # it runs directly so argv[0] and any /proc/self/exe self-re-exec stay correct
  # (LPE PoCs that re-invoke themselves break under an explicit "ld.so ./exploit").
  # Faithful port of the former hardcoded run-wrapper loader-prefix block.
  poc_launch_script: |
    LOADER=$(find "$RUN_LIB" -maxdepth 1 -name 'ld-*.so*' 2>/dev/null | head -1)
    INTERP=$(readelf -l /poc/exploit 2>/dev/null | sed -n 's/.*program interpreter: \(.*\)]/\1/p' | head -1)
    case "$INTERP" in
      "$RUN_LIB"/*) SSD_EXEC_PREFIX=; echo "  PoC uses project interpreter ($INTERP) — running directly" ;;
      *) if [ -n "$LOADER" ] && [ -x "$LOADER" ]; then SSD_EXEC_PREFIX="$LOADER --library-path $RUN_LIB"; echo "  Forcing project loader (binary interpreter: ${INTERP:-none})"; else SSD_EXEC_PREFIX=; fi ;;
    esac

  # Build system tag (informational; pipeline uses build_script above, not this).
  build_system: "autotools"

  # ---- Phase 3 patched-image rebuild recipe (PROJECT-SUPPLIED) ----
  # The patched validation image derives FROM the Phase 1 CVE image (so the
  # SOURCE_DIR/BUILD_DIR/INSTALL_PREFIX env are inherited) and copies the patched
  # file over its in-tree path. This script does the INCREMENTAL rebuild + the
  # verification markers Phase 3 reads. $VULN_FILE is the patched file (relative
  # to the source tree). Tolerant (-k) like Phase 1 and never exits non-zero on a
  # mere compile failure — that is surfaced via the empty /tmp/ssd_obj_rebuilt
  # marker, not by failing the image build. Mirrors the Phase 1 honesty gate.
  patch_rebuild_script: |
    #!/bin/bash
    cd "$BUILD_DIR" || { echo "no build dir" > /tmp/ssd_rebuild.log; }
    make -j"$(nproc)" -k > /tmp/ssd_rebuild.log 2>&1; echo "rebuild exit: $?"; tail -30 /tmp/ssd_rebuild.log
    make install -k > /tmp/ssd_install.log 2>&1; echo "install exit: $?"; tail -10 /tmp/ssd_install.log
    # Compiler errors for the feedback loop (real gcc diagnostics, not make noise).
    grep -B2 -A8 "error:" /tmp/ssd_rebuild.log 2>/dev/null | head -100 > /tmp/ssd_build_errors; true
    # Object-rebuilt check — only meaningful for .c (a header patch rebuilds many
    # objects with unrelated names). Empty marker = the patched object didn't build.
    case "$VULN_FILE" in
      *.c) OBJ="$(basename "$VULN_FILE" .c).o"
           find "$BUILD_DIR" -name "$OBJ" -newer "$SOURCE_DIR/$VULN_FILE" -print -quit > /tmp/ssd_obj_rebuilt
           echo "obj_rebuilt: $(cat /tmp/ssd_obj_rebuilt)" ;;
      *)   echo skip > /tmp/ssd_obj_rebuilt ;;
    esac
    # Honesty re-check: run the PoC through the project's own loader and confirm it
    # maps the project libc (LD_LIBRARY_PATH ldd fallback). Keep in sync with the
    # Phase 1 marker + read_poc_uses_build.
    LOADER=$(find "$INSTALL_PREFIX"/lib -maxdepth 1 -name 'ld-*.so*' 2>/dev/null | head -1)
    USES=no
    if [ -n "$LOADER" ] && "$LOADER" --library-path "$INSTALL_PREFIX"/lib --list /poc/exploit 2>/dev/null | grep -q "$INSTALL_PREFIX"; then USES=yes
    elif LD_LIBRARY_PATH="$INSTALL_PREFIX"/lib ldd /poc/exploit 2>/dev/null | grep -q "$INSTALL_PREFIX"; then USES=yes; fi
    echo "$USES" > /tmp/ssd_poc_uses_build; echo "poc_uses_build: $USES"

  # Option A — in-tree regression-test reproducer (poc_language: intree-test).
  # PROJECT-SPECIFIC RECIPE lives HERE, not in the pipeline code. The pipeline
  # only checks out the vulnerable commit, overlays the files the fix ADDED
  # (test + helpers), exports the env contract (BUILD_DIR, SOURCE_DIR,
  # INSTALL_PREFIX, TEST_SUBDIR, TEST_NAME, TEST_PATH, FIX_COMMIT, COMMIT_HASH),
  # runs build_script then run_script, and reads SSD_TEST_RESULT. If this block
  # is omitted, in-tree-test CVEs route to manual for this project (no global
  # default — another project, e.g. tomcat/kernel, supplies its own here).
  # run_script MUST print SSD_TEST_RESULT=PASS|FAIL|NORESULT and exit 0|1|2
  # (verdict: the test FAILS on the vulnerable build = reproduced).
  intree_test:
    # glibc/autotools build: era-matched compiler, register the test (the fix
    # edits the subdir Makefile's `tests` list), configure + make.
    build_script: |
      #!/bin/bash
      (apt-get update && apt-get install -y gcc-13 g++-13) >/dev/null 2>&1 || true
      CC=gcc; command -v gcc-13 >/dev/null 2>&1 && CC=gcc-13
      # Overlay the build-system metadata (Makefiles) the fix changed so the test
      # is REGISTERED in its subdir's test list. The registering Makefile is NOT
      # always $TEST_SUBDIR/Makefile: a sysdeps test is registered in its sysdeps
      # fragment Makefile (e.g. sysdeps/ieee754/ldbl-96/Makefile under
      # `ifeq ($(subdir),math)`), not math/Makefile. Overlaying every fix-changed
      # Makefile covers both; Makefiles carry no vulnerability, so the SOURCE stays
      # vulnerable. Without this, `make test t=math/<name>` fails "No rule to make
      # target .../math/<name>.out" and the CVE is lost as NORESULT.
      for mf in $(git -C "$SOURCE_DIR" diff-tree --no-commit-id --name-only -r "$FIX_COMMIT" 2>/dev/null | grep -E '(^|/)Makefile$'); do
        git -C "$SOURCE_DIR" checkout "$FIX_COMMIT" -- "$mf" 2>/dev/null && echo "overlaid Makefile: $mf"
      done
      cd "$BUILD_DIR" || exit 1
      rm -rf ./*
      "$SOURCE_DIR"/configure --prefix="$INSTALL_PREFIX" --disable-werror CC="$CC" \
        > /build/cfg.log 2>&1 && echo CONFIG_OK || { echo CONFIG_FAIL; tail -30 /build/cfg.log; exit 1; }
      make -j"$(nproc)" -k > /build/make.log 2>&1; echo "BUILD_RC=$?" >> /build/build_status
      tail -15 /build/make.log; echo "build complete"
    # glibc test run: three cross-version strategies, tried in order.
    #  0. Build-honesty gate — if the era build did not produce a trustworthy
    #     runtime (BUILD_RC != 0 or no build loader), emit NORESULT. A test "run"
    #     against the missing build glibc would silently fall back to the HOST's
    #     (patched) glibc and report a meaningless PASS, so refuse instead.
    #  1. `make test t=` — native single-test target (glibc >= ~2.34 only).
    #  2. standalone compile, run ONLY through the build runtime (build loader,
    #     never the host libc). A real crash/abort here IS the repro signal and is
    #     trusted immediately; a PASS is NOT trusted yet (a support/-framework test
    #     compiled without its fixtures trivially passes) — it defers to Strategy 3.
    #  3. `make check subdirs=` — glibc's own per-subdir runner, for tests that use
    #     the support/ framework (which the standalone compile can't link).
    # UNSUPPORTED is treated as no-result (test could not run) — NOT as FAIL — so
    # it never fakes a reproduction.
    run_script: |
      #!/bin/bash
      # Ensure the test process owns a supplementary group different from its GID.
      # glibc's setuid/privilege-drop tests (support_capture_subprogram_self_sgid)
      # scan getgroups() for a GID != current and FAIL_UNSUPPORTED without one — so
      # run as root with only group 0 they never execute (e.g. CVE-2023-4911,
      # "Looney Tunables"). Re-exec once under setpriv with groups {0,1}. Probe
      # first so a setpriv/group quirk degrades gracefully instead of bricking.
      if [ -z "$SSD_SGID_SETUP" ] && [ "$(id -u)" = "0" ] && command -v setpriv >/dev/null 2>&1 \
           && setpriv --groups 0,1 -- true >/dev/null 2>&1; then
          export SSD_SGID_SETUP=1
          exec setpriv --groups 0,1 -- "$0" "$@"
      fi
      cd "$BUILD_DIR" || { echo "SSD_TEST_RESULT=NORESULT (no build dir)"; exit 2; }
      echo "--- in-tree test: $TEST_SUBDIR/$TEST_NAME ---"
      # Strategy 0: build-honesty gate. Never run a test when there is no built
      # runtime to run it against — that would fall through to the host libc.
      # Gate on the ARTEFACTS (loader + libc), NOT on BUILD_RC: glibc's `make -k`
      # routinely exits non-zero for an unrelated target (a manual/doc/xtest)
      # while still producing a fully-working libc.so + ld.so. A non-zero
      # BUILD_RC with a present loader is logged and allowed through — the
      # separate Gate A sanity probe validates the runtime actually starts.
      BRC=$(sed -n 's/^BUILD_RC=//p' /build/build_status 2>/dev/null | tail -1)
      LOADER=$(ls "$BUILD_DIR"/elf/ld-*.so* 2>/dev/null | head -1)
      LIBC=$(ls "$BUILD_DIR"/libc.so.6 "$BUILD_DIR"/libc.so 2>/dev/null | head -1)
      if [ -z "$LOADER" ] || [ -z "$LIBC" ]; then
          echo "build status: BUILD_RC=${BRC:-<none>} loader=${LOADER:-<none>} libc=${LIBC:-<none>}"
          echo "SSD_TEST_RESULT=NORESULT (era build produced no runtime — no loader/libc to test against)"; exit 2
      fi
      [ "${BRC:-0}" != "0" ] && echo "note: BUILD_RC=$BRC but loader+libc present — proceeding (Gate A validates the runtime)"
      # Library path spanning every build subdir (matches testrun.sh / Gate A).
      LIBP="$BUILD_DIR"; for d in "$BUILD_DIR"/*/; do LIBP="$LIBP:${d%/}"; done
      # Run $1 through the BUILD runtime (build glibc), never the host libc.
      # Prefers the build's own testrun.sh; otherwise invokes the build loader
      # explicitly. Sets global $rc. Refuses to fall back to a bare host run.
      run_built() {
          rc=200
          if [ -x "$BUILD_DIR/testrun.sh" ]; then
              timeout "${INTREE_TEST_TIMEOUT:-320}" "$BUILD_DIR/testrun.sh" "$1" > /tmp/it.log 2>&1; rc=$?
              grep -qiE "cannot execute|not a dynamic|error while loading|No such file" /tmp/it.log 2>/dev/null && rc=200
          fi
          if [ "$rc" -eq 200 ]; then
              GCONV_PATH="$BUILD_DIR/iconvdata" timeout "${INTREE_TEST_TIMEOUT:-320}" \
                  "$LOADER" --library-path "$LIBP" "$1" > /tmp/it.log 2>&1; rc=$?
          fi
      }
      TR="$BUILD_DIR/$TEST_SUBDIR/$TEST_NAME.test-result"
      emit_from_result() {
          [ -f "$TR" ] || return 1
          echo "--- result ($TR) ---"; cat "$TR"
          grep -qE '^PASS' "$TR" && { echo "SSD_TEST_RESULT=PASS"; exit 0; }
          grep -qE '^(FAIL|ERROR|UNRESOLVED)' "$TR" && { echo "SSD_TEST_RESULT=FAIL"; exit 1; }
          grep -qE '^UNSUPPORTED' "$TR" && { echo "SSD_TEST_RESULT=NORESULT (test UNSUPPORTED on this build)"; exit 2; }
          return 1
      }
      # Strategy 1: native single-test target (glibc >= ~2.34).
      rm -f "$TR"
      timeout "${INTREE_TEST_TIMEOUT:-320}" make test "t=$TEST_SUBDIR/$TEST_NAME" > /tmp/mt.log 2>&1
      tail -20 /tmp/mt.log
      emit_from_result
      # Strategy 2: standalone compile, run through the build runtime only.
      echo "--- single-test target unavailable; standalone compile ---"
      CC=gcc; command -v gcc-13 >/dev/null 2>&1 && CC=gcc-13
      # Compile against SYSTEM headers (no glibc-internal -I: the tree's include/
      # has internal header variants that conflict with system libc headers and
      # break a standalone compile). support/-framework tests fail here on
      # purpose and drop to the subdir runner below.
      "$CC" -O2 -D_GNU_SOURCE "-DTEST_DATA_LIMIT=(3UL<<30)" "$SOURCE_DIR/$TEST_PATH" \
          -o /tmp/itest -lpthread -lm 2>/tmp/cc.log \
        || "$CC" -O2 -D_GNU_SOURCE "$SOURCE_DIR/$TEST_PATH" -o /tmp/itest 2>>/tmp/cc.log
      s2=NONE
      if [ -x /tmp/itest ]; then
          run_built /tmp/itest
          tail -20 /tmp/it.log
          if [ "$rc" -ne 0 ]; then
              # Real crash/abort/assert on the vulnerable build = the repro signal.
              echo "SSD_TEST_RESULT=FAIL"; exit 1
          fi
          # A standalone PASS is not yet trusted (may be a framework test missing
          # its fixtures). Verify via the real harness before accepting it.
          s2=PASS
          echo "standalone run PASSED — verifying via subdir harness before trusting"
      else
          echo "standalone compile failed (likely a support/ framework test):"; tail -8 /tmp/cc.log 2>/dev/null
      fi
      # Strategy 3: cross-version subdir runner — for support/-framework tests.
      # Bounded; big subdirs may not finish; can relink on old glibc.
      echo "--- running subdir test set ($TEST_SUBDIR) ---"
      rm -f "$TR"
      # -k: keep going past UNRELATED sibling-test failures in the subdir so our
      # target test still gets built+run and writes its .test-result.
      timeout "${INTREE_SUBDIR_TIMEOUT:-1500}" make -k check "subdirs=$TEST_SUBDIR" test-wrapper= > /tmp/chk.log 2>&1
      tail -20 /tmp/chk.log
      emit_from_result
      # Harness produced no verdict: accept a prior standalone PASS if we had one.
      if [ "$s2" = "PASS" ]; then echo "SSD_TEST_RESULT=PASS"; exit 0; fi
      echo "SSD_TEST_RESULT=NORESULT"; exit 2
    # Gate A: loader/runtime sanity probe. Asks ONE question — can the built
    # runtime start a process? — by running a TRIVIAL freshly-compiled
    # `int main(){return 0;}` through the build loader (resolving the build libc
    # via --library-path, exactly as `make test` launches a test). If the built
    # loader/libc is miscompiled (e.g. old glibc on a too-new base) it SIGSEGVs
    # at startup (rc>=128) before main — so a test FAIL is the loader, not the CVE.
    #
    # Do NOT probe with glibc's own tools (ldconfig/sln/iconv): they are NOT
    # trivial — they read config, scan dirs, require args, and SIGSEGV for their
    # OWN reasons on a perfectly healthy runtime, which made Gate A reject ~17
    # CVEs whose runtime actually works fine (verified: a trivial binary runs rc=0
    # through every one of those build loaders). The hello-world is the only
    # faithful "can it start a process" probe.
    # Exit 0 = runtime OK; exit 1 = broken; can't-probe → exit 0 (gate off).
    sanity_check: |
      #!/bin/bash
      set +e
      LOADER=$(ls "$BUILD_DIR"/elf/ld-*.so* 2>/dev/null | head -1)
      if [ -z "$LOADER" ]; then
        echo "SSD_SANITY: cannot probe (no loader)"; exit 0
      fi
      LIBP="$BUILD_DIR"
      for d in "$BUILD_DIR"/*/; do LIBP="$LIBP:${d%/}"; done
      CC=gcc; command -v gcc-13 >/dev/null 2>&1 && CC=gcc-13
      printf '%s' 'int main(void){return 0;}' > /tmp/ssd_sanity.c
      if ! "$CC" /tmp/ssd_sanity.c -o /tmp/ssd_sanity 2>/dev/null; then
        echo "SSD_SANITY: cannot probe (compile failed)"; exit 0
      fi
      "$LOADER" --library-path "$LIBP" /tmp/ssd_sanity >/dev/null 2>&1
      rc=$?
      echo "SSD_SANITY: rc=$rc probe=trivial-hello"
      [ "$rc" -ge 128 ] && exit 1
      exit 0

  # configure flags passed during the build (autotools only).
  # These are appended AFTER the strategy-specific flags that Phase 1 inserts.
  extra_configure_flags: []

  # Install prefix inside the container for the compiled project artefacts.
  # Phase 1 links PoCs against libraries found here.
  install_prefix: "/opt/project-build"

  # Project framing for the LLM PoC-analysis prompts (poc_analyzer.py: driver
  # synthesis + execution strategy, used for payload-generator/"OTHER" PoCs).
  # The code carries a GENERIC default; this sharpens it for glibc. Omit the
  # block entirely for other projects to get the generic phrasing.
  #   project_name : human name used in the prompt
  #   reach_hint   : how to feed a crafted payload to the vulnerable function
  poc_analysis:
    project_name: "the GNU C Library (glibc)"
    reach_hint: >-
      for a tzfile payload: write it to a file, point TZ at that file with a
      leading ':' or install it under a TZ name, then call tzset()/localtime();
      for a locale payload: install it and call setlocale()/newlocale(); etc.

  # Environment variables exported right before a PoC runs against the project
  # build (Phase 1 baseline AND the inherited Phase 3 validation). This is a
  # GENERIC pipeline hook — the orchestrator just exports whatever is listed
  # here, with no built-in project knowledge — so it stays project-agnostic;
  # each project's config decides what (if anything) it needs.
  #
  # Why glibc needs it: some memory-corruption bugs do not change the exit code
  # on their own. CVE-2012-4412's strcoll integer overflow corrupts the heap but
  # the PoC still exits 0 (identical on vulnerable and patched builds), so
  # exit-code comparison is blind to it. glibc's own allocator can ABORT on such
  # corruption when MALLOC_CHECK_ is set, turning a silent bug into a detectable
  # SIGABRT baseline that a correct patch then prevents. MALLOC_PERTURB_ surfaces
  # use of clobbered memory. (Honored only for non-setuid binaries — PoCs run as
  # an unprivileged user, so it applies.)
  #
  # Other projects: leave empty ({}) if not needed, or set the equivalent for
  # that ecosystem (e.g. a kernel build's sanitizer knobs, a JVM's options).
  poc_run_env:
    MALLOC_CHECK_: "3"
    MALLOC_PERTURB_: "42"

  # Name of the source directory inside the Docker build context.
  # Must be a single path component (no slashes).
  source_dir_name: "project-src"

  # Name of the build directory inside the Docker build context.
  build_dir_name: "project-build"

  # Commit-year → Ubuntu-version era map.
  # Format: {year: "ubuntu_version"}.  Missing years are clamped to the nearest bound.
  # Remove or leave empty ({}) to disable era mapping (use CSV ubuntu_version as-is).
  commit_era_map:
    1995: "12.04"
    1996: "12.04"
    1997: "12.04"
    1998: "12.04"
    1999: "12.04"
    2000: "14.04"
    2001: "14.04"
    2002: "14.04"
    2003: "14.04"
    2004: "14.04"
    2005: "14.04"
    2006: "14.04"
    2007: "14.04"
    2008: "14.04"
    2009: "14.04"
    2010: "14.04"
    2011: "14.04"
    2012: "14.04"
    2013: "14.04"
    2014: "14.04"
    2015: "16.04"
    2016: "16.04"
    2017: "18.04"
    2018: "18.04"
    2019: "20.04"
    2020: "20.04"
    2021: "22.04"
    2022: "22.04"
    # Modern glibc (>= ~2.35) builds reliably on 22.04/gcc-11; 24.04's default
    # gcc-14 cannot build glibc <= ~2.39 ("always_inline 'syslog'"). Map recent
    # eras to 22.04 so the in-tree-test build (Option A) uses a matched toolchain.
    2023: "22.04"
    2024: "22.04"
    2025: "22.04"
    2026: "22.04"

  # ---------------------------------------------------------------------------
  # Version-based era selection (takes precedence over commit_era_map).
  #
  # commit_era_map keys off the *commit date*, which is WRONG for backport
  # commits: a 2024-dated fix backported to the release/2.31 branch would be
  # built on the 2024 era (Ubuntu 22.04) even though the tree is glibc 2.31,
  # whose loader/runtime expects the 20.04 era. Building old glibc on a too-new
  # base yields a miscompiled ld.so that SIGSEGVs at vDSO setup before the test
  # even runs — a false baseline.
  #
  # When version_file + version_era_map are set, Phase 1 reads the project's
  # version from the *checked-out tree* (ground truth for the build) and maps
  # THAT to the build era. commit_era_map remains the fallback when the version
  # cannot be read. Leave version_file empty to disable and use commit dates.
  #
  # version_file: path (relative to the source tree root) to read at COMMIT_HASH.
  # version_regex: first capture group is the version string.
  version_file: "version.h"
  version_regex: '#define\s+VERSION\s+"([0-9][0-9.]*)"'

  # version → Ubuntu-version era. Closest-older match: the tree's version maps
  # to the era of the largest key <= it (e.g. 2.33 -> 2.31 -> 20.04). Mirrors
  # the glibc-version → Ubuntu shipping map; mismatch here is what triggers the
  # loader-vDSO crash, so keep it aligned with which Ubuntu ships each glibc.
  version_era_map:
    # Pre-2.15 floor. glibc older than 2.15 shipped on Ubuntu releases earlier
    # than 12.04, but 12.04 is our OLDEST base image — and it builds these old
    # trees cleanly. Without a key <= the tree version, map_version_to_era()
    # returns None and Gate B wrongly falls back to the COMMIT DATE: a 2011-dated
    # 2.14.90 tree (CVE-2009-5029) then lands on 14.04, whose binutils/gcc fail
    # its intl PIC build (no libc.so.6 -> false "manual revision"). Verified:
    # 2.14.90 builds rc=0 with libc.so.6 on 12.04, fails on 14.04. So pin the
    # whole pre-2.15 range to 12.04 (the closest-older match makes 2.0..2.14.x
    # resolve here).
    "2.0": "12.04"
    "2.15": "12.04"
    "2.19": "14.04"
    "2.23": "16.04"
    "2.27": "18.04"
    "2.31": "20.04"
    "2.35": "22.04"
    "2.39": "22.04"
    # glibc >= 2.40 needs a newer toolchain than 22.04's gcc-11 (older bases
    # CONFIG_FAIL on bleeding-edge trees). 24.04 ships gcc-13/14. Safe for the
    # loader gate too: only NEW glibc maps here, and new loaders handle 6.8's
    # vDSO fine (the old-glibc-on-new-kernel crash is the reverse case).
    "2.40": "24.04"

