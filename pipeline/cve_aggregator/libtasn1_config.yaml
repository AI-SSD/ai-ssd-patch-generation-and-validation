# =============================================================================
# CVE Aggregator Pipeline – GNU Libtasn1 Configuration  (GLIBC-SHAPE, INTREE-FIRST)
# =============================================================================
# Small GNU C library (ASN.1/DER parser). Chosen as a high-probability reproduction
# target: it is the SAME shape as glibc/libxml2 (pure-C shared library, autotools),
# its CVEs are self-contained CRASH-ON-PARSE of malformed ASN.1 (no network, no VM,
# no external sample suite), AND — like glibc — it COMMITS C regression tests with
# its fixes (tests/Test_*.c), which the Option-A harvester (is_regression_test_path)
# can grab. That is exactly what openssl/ffmpeg lacked. Strategy is INTREE-FIRST:
# libtasn1 has ~no ExploitDB PoCs, so the fix-commit test is the primary reproducer.
# Build hooks are UNTESTED STARTING POINTS — expect first-run VM iteration.
# Run: python3 pipeline.py --project libtasn1 --phases 0 1
# =============================================================================

project:
  name: "libtasn1"
  display_name: "GNU Libtasn1"
  description: "CVE and PoC dataset for GNU Libtasn1"

pipeline:
  abort_on_error: false
  skip_modules: []

# INTREE-FIRST: libtasn1's reproducible artifact is the fix-commit regression test,
# not a public PoC. Phase 1 prefers the harvested test; ExploitDB is the fallback.
reproduction_strategy:
  - intree
  - exploitdb

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/libtasn1_cve_aggregator.log"

# ---------------------------------------------------------------------------
# Module 1: CVE Fetching
# ---------------------------------------------------------------------------
cve_fetcher:
  nvd_api_key: "043bad81-616b-445a-8e79-96e87cc96c66"
  keywords:
    - "libtasn1"
    - "GNU Libtasn1"
  cpe_match:
    - "cpe:2.3:a:gnu:libtasn1"
  strong_keywords:
    - "libtasn1"
    - "Libtasn1"
  # Exclude the parent/sibling projects that co-mention libtasn1.
  non_target_indicators:
    - "GnuTLS"
    - "gnutls"
    - "OpenSSL"
    - "Nettle"
  strict_target_matching: true
  require_project_cpe_match: false
  project_cpe_aliases:
    - "libtasn1"
    - "gnu:libtasn1"
  enrich_with_cve_org: false
  cve_org_delay: 1.0
  min_published_year: 2006

# ---------------------------------------------------------------------------
# Module 2: Commit Discovery
# ---------------------------------------------------------------------------
commit_discovery:
  repo_url: "https://gitlab.com/gnutls/libtasn1.git"
  repo_local_path: "../libtasn1"
  clone_timeout: 600
  harvest_regression_tests: true        # superseded by reproduction_strategy; kept for clarity
  auto_update: true
  extra_grep_patterns: []
  # GNU project tracked on Savannah/GitLab, not Bugzilla.
  enable_bz_fallback: false
  allow_unscoped_extra_patterns: false
  bugzilla_hosts: []
  enable_online_bug_resolution: false
  source_extensions:
    - ".c"
    - ".h"

# ---------------------------------------------------------------------------
# Module 3: PoC Mapping (ExploitDB)
# ---------------------------------------------------------------------------
poc_mapper:
  exploitdb_path: "../exploit-database"
  exploitdb_remote_url: "https://gitlab.com/exploit-database/exploitdb.git"
  auto_update: true
  deep_search: true                      # libtasn1 PoCs are scarce — search contents too
  extract_content: true
  reverse_search: true
  enable_reverse_content_grep: true
  require_verified: false
  prefer_platforms:
    - "linux"
  non_target_indicators:
    - "GnuTLS"

# ---------------------------------------------------------------------------
# Module 4–7: Aggregator / Validation / Repair / Output
# ---------------------------------------------------------------------------
data_aggregator:
  global_json_path: "results/libtasn1_cve_poc_map.json"
  prune_missing_cves: true

syntax_validator:
  manual_supervision_dir: "manual_supervision"
  report_path: "results/libtasn1_syntax_validation_report.json"
  allow_manual_without_commit: false

poc_repair:
  provider: "openai"
  openai_model: "gpt-4.1-mini"
  openai_api_key: ""
  api_endpoint: "http://10.3.2.171:80/api/chat"
  model: "devstral:32k"
  max_repair_attempts: 3
  models_by_attempt:
    1: "gpt-4.1-mini"
    2: "gpt-5-mini"
    3: "gpt-4.1"
  api_timeout: 600
  model_load_timeout: 300
  num_ctx: 32768
  max_poc_chars: 0

  # Estimated local generation speed (tokens/sec), used ONLY by the pre-flight
  # "too slow to repair within api_timeout" skip (provider: ollama). The default
  # 3 tok/s is a conservative CPU-only figure: at that rate any PoC larger than
  # ~api_timeout*0.8*rate output tokens is routed to manual review BEFORE the
  # repair loop — which also pre-empts the context-window ramp on large PoCs.
  # Set this to your GPU's real throughput (e.g. 30-100) so the ramp can engage.
  local_token_rate: 3
  # Same estimate for the OpenAI provider; openai windows are large so the
  # context ramp is a no-op there and only this time gate applies.
  openai_token_rate: 150
  temperature: 0.4
  report_path: "results/libtasn1_poc_repair_report.json"
  manual_review_queue_path: "results/libtasn1_manual_review_queue.json"
  gpu_wait_timeout: 120

output:
  global_json_path: "results/libtasn1_cve_poc_map.json"
  filtered_json_path: "results/libtasn1_cve_poc_map_filtered.json"
  csv_path: "results/libtasn1_cve_poc_complete.csv"
  poc_dir: "exploits"
  filtered_require_commit: false
  filtered_require_poc: true
  filtered_require_verified_poc: false
  flag_unvalidated_edb_for_manual_review: true
  manual_supervision_dir: "manual_supervision"
  allow_poc_without_commit: false
  csv_fields:
    - "CVE"
    - "V_COMMIT"
    - "FilePath"
    - "F_NAME"
    - "UNIT_TYPE"
    - "V_FILE"
    - "V_FUNCTION"
    - "CVE_Description"
    - "CWE"
    - "CWE_Description"
    - "project_version"
    - "project_version_normalized"
    - "ubuntu_version"
    - "poc_index"
    - "poc_path"
    - "poc_language"
    - "FIX_COMMIT"
    - "TEST_PATH"
    - "TEST_SUBDIR"
    - "manual_review_required"
    - "manual_verified"

# ---------------------------------------------------------------------------
# Phase 2: LLM patch generation (C)
# ---------------------------------------------------------------------------
phase2:
  language: "c"
  system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for GNU Libtasn1 (the ASN.1/DER parsing library). Your task is to fix a
    security vulnerability by making the SMALLEST POSSIBLE EDIT to the vulnerable
    function — never by rewriting it.
  feedback_system_prompt: >-
    You are an expert C security engineer specializing in vulnerability patching
    for GNU Libtasn1. Your previous patch attempt FAILED validation. Analyze the
    failure and produce an improved fix as MINIMAL edits — never rewrite the whole
    function.
  internal_headers: []

# ---------------------------------------------------------------------------
# Phase 3: SAST (C stack — same as glibc/libxml2)
# ---------------------------------------------------------------------------
sast:
  enabled: true
  fail_on: [critical, high]
  tool_timeout: 180
  tools:
    - name: cppcheck
      detect: cppcheck
      cmd: ["cppcheck", "--enable=all", "--xml", "--xml-version=2", "{file}"]
      parser: cppcheck-xml
      install: { apt: cppcheck }
    - name: clang-tidy
      detect: clang-tidy
      cmd: ["clang-tidy", "--quiet", "--checks=clang-analyzer-*,bugprone-*,cert-*", "{file}", "--"]
      parser: regex
      regex: '^(.+?):(\d+):(\d+):\s+(warning|error):\s+(.+?)\s+\[([^\]]+)\]$'
      groups: { file: 1, line: 2, column: 3, severity: 4, message: 5, rule: 6 }
      severity_map: { warning: medium, error: high }
      install: { apt: clang-tidy }
    - name: semgrep
      detect: semgrep
      cmd: ["semgrep", "scan", "--sarif", "--quiet", "--metrics=off", "--config=p/c", "{file}"]
      parser: sarif
      install: { pip: semgrep }
    - name: flawfinder
      detect: flawfinder
      cmd: ["flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      fallback_cmd: ["{python}", "-m", "flawfinder", "--minlevel=1", "--dataonly", "--quiet", "{file}"]
      parser: flawfinder
      install: { pip: flawfinder }

# ---------------------------------------------------------------------------
# Phase 1: reproduction (shared with Phase 3)
# ---------------------------------------------------------------------------
phase1:
  project_repo_local_path: "../libtasn1"
  project_repo_remote_url: "https://gitlab.com/gnutls/libtasn1.git"
  docker_base_image_prefix: "ai-ssd/libtasn1-base"
  docker_cve_image_prefix: "ai-ssd/libtasn1-cve"
  image_manifest_path: "results/libtasn1_image_manifest.json"
  source_dir_name: "project-src"
  build_dir_name: "project-build"
  install_prefix: "/opt/project-build"

  # libtasn1 bootstraps from git via gnulib; needs the autotools + a parser gen.
  base_packages:
    - build-essential
    - autoconf
    - automake
    - libtool
    - pkg-config
    - bison
    - gettext
  base_packages_optional:
    - texinfo
    - git
    - wget
    - gcc-multilib
    - g++-multilib
  base_setup: |
    dpkg --add-architecture i386 && apt-get update && apt-get install -y libc6-dev-i386 || true

  # libtasn1 builds cleanly across eras; map by commit date.
  commit_era_map:
    2006: "14.04"
    2008: "14.04"
    2010: "14.04"
    2012: "14.04"
    2014: "16.04"
    2016: "16.04"
    2017: "18.04"
    2018: "18.04"
    2019: "20.04"
    2020: "20.04"
    2021: "22.04"
    2022: "22.04"
    2023: "24.04"
    2024: "24.04"
    2025: "24.04"
    2026: "24.04"

  version_file: ""
  version_regex: ''
  version_era_map: {}
  enable_arch_fallback: true

  # libtasn1 uses the glibc allocator — surface silent heap corruption like glibc.
  poc_run_env:
    MALLOC_CHECK_: "3"
    MALLOC_PERTURB_: "42"

  # ---- build_script — STARTING POINT, UNTESTED ----
  # git checkout has no ./configure: bootstrap (pulls gnulib) then out-of-tree
  # configure + make + install. --disable-doc avoids gtk-doc/texinfo gates.
  build_script: |
    #!/bin/bash
    SRC="$SOURCE_DIR"; BD="$BUILD_DIR"; PFX="$INSTALL_PREFIX"
    ARCHFLAGS=""; HOST=""
    if [ "$BUILD_ARCH" = "i386" ]; then ARCHFLAGS="-m32"; HOST="--host=i686-linux-gnu --build=i686-linux-gnu"; fi
    cd "$SRC" || exit 1
    if [ ! -x "$SRC/configure" ]; then
      git submodule update --init >/build/bootstrap.log 2>&1 || true
      # GNU automake (gnu strictness) ABORTS without ChangeLog/AUTHORS/NEWS/README;
      # git checkouts omit the generated ChangeLog. Stub them so autoreconf succeeds.
      touch ChangeLog AUTHORS NEWS README 2>/dev/null || true
      ( ./bootstrap --skip-po >>/build/bootstrap.log 2>&1 \
        || autoreconf -fi >>/build/bootstrap.log 2>&1 ) || { echo "BOOTSTRAP_FAIL"; tail -25 /build/bootstrap.log; }
    fi
    cd "$BD" || exit 1; rm -rf ./*
    ( "$SRC"/configure --prefix="$PFX" --disable-doc $HOST CFLAGS="$ARCHFLAGS -O2 -g -w -U_FORTIFY_SOURCE" 2>&1 && echo CONFIGURE_OK ) \
      > /build/cfg.log 2>&1 || { echo "CONFIGURE_FAIL"; tail -25 /build/cfg.log; }
    make -j"$(nproc)" -k > /build/make.log 2>&1; echo "PROJECT_BUILD_EXIT_CODE=$?" >> /build/build_status; tail -20 /build/make.log
    make install -k > /build/make_install.log 2>&1; echo "PROJECT_INSTALL_EXIT_CODE=$?" >> /build/build_status
    if ls "$PFX"/lib/libtasn1.so* 2>/dev/null | grep -q .; then echo "PROJECT_BUILD_INSTALLED=yes" >> /build/build_status; else echo "PROJECT_BUILD_INSTALLED=no" >> /build/build_status; fi
    echo "build complete"

  # ---- poc_prepare_script — compile the C PoC against the project libtasn1 ----
  # Library shape (glibc/libxml2): link the build's libtasn1, run under the system
  # loader with LD_LIBRARY_PATH at the project lib (default poc_launch). Honesty =
  # the PoC resolves the project libtasn1.
  poc_prepare_script: |
    #!/bin/bash
    PFX="$INSTALL_PREFIX"
    M32=""; [ "$BUILD_ARCH" = "i386" ] && M32="-m32"
    cd /poc
    if grep -qE '^[[:space:]]*(int|void)?[[:space:]]*main[[:space:]]*\(' /poc/exploit_raw.c; then
      cp /poc/exploit_raw.c /poc/exploit.c
    else
      echo '#include <stdio.h>' > /poc/exploit.c
      echo '#include <stdlib.h>' >> /poc/exploit.c
      echo '#include <string.h>' >> /poc/exploit.c
      cat /poc/exploit_raw.c >> /poc/exploit.c
      echo '' >> /poc/exploit.c
      echo 'int main(int argc, char *argv[]) { puts("fragment loaded"); return 0; }' >> /poc/exploit.c
    fi
    INC="-I$PFX/include"
    rm -f /poc/exploit
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c $INC -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -ltasn1 2>&1 || \
    gcc $M32 -O0 -g -w -D_GNU_SOURCE -o exploit exploit.c -ltasn1 2>&1 || \
    gcc $M32 -O0 -g -w -o exploit exploit.c 2>&1 || \
    echo "compile failed"
    if [ -f /poc/exploit ]; then echo "SUCCESS"; file /poc/exploit; else echo "ERROR: failed to compile"; head -30 /poc/exploit.c; exit 1; fi
    for c in $POC_COMPANIONS; do
      stem="${c%.*}"
      case "$c" in
        *.c) ( gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" -I"$PFX/include" -L"$PFX/lib" -Wl,-rpath,"$PFX/lib" -ltasn1 2>&1 || gcc -O0 -g -w -o "/poc/$stem" "/poc/$c" 2>&1 || echo "WARN: companion $c" ) ;;
        *.sh|*.py|*.pl|*.rb) chmod +x "/poc/$c" 2>/dev/null || true ;;
      esac
    done
    USES=no
    if LD_LIBRARY_PATH="$PFX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$PFX"; then USES=yes; fi
    echo "$USES" > /poc/.ssd_poc_uses_build; echo "poc_uses_project_build: $USES"

  # No project loader needed — default launch (direct run, LD_LIBRARY_PATH=$RUN_LIB).
  poc_launch_script: ""

  # ---- patch_rebuild_script — incremental make + markers ----
  patch_rebuild_script: |
    #!/bin/bash
    cd "$BUILD_DIR" || { echo "no build dir" > /tmp/ssd_rebuild.log; }
    make -j"$(nproc)" -k > /tmp/ssd_rebuild.log 2>&1; echo "rebuild exit: $?"; tail -30 /tmp/ssd_rebuild.log
    make install -k > /tmp/ssd_install.log 2>&1; echo "install exit: $?"
    grep -B2 -A8 "error:" /tmp/ssd_rebuild.log 2>/dev/null | head -100 > /tmp/ssd_build_errors; true
    case "$VULN_FILE" in
      *.c) OBJ="$(basename "$VULN_FILE" .c).o"; find "$BUILD_DIR" -name "$OBJ" -newer "$SOURCE_DIR/$VULN_FILE" -print -quit > /tmp/ssd_obj_rebuilt; echo "obj_rebuilt: $(cat /tmp/ssd_obj_rebuilt)" ;;
      *) echo skip > /tmp/ssd_obj_rebuilt ;;
    esac
    USES=no
    if LD_LIBRARY_PATH="$INSTALL_PREFIX/lib" ldd /poc/exploit 2>/dev/null | grep -q "$INSTALL_PREFIX"; then USES=yes; fi
    echo "$USES" > /tmp/ssd_poc_uses_build; echo "poc_uses_build: $USES"

  # ---- Option A: in-tree regression test (poc_language: intree-test) ----
  # STARTING POINT, UNTESTED. libtasn1 ships C tests (tests/Test_*.c) the fix
  # commits extend — harvested by is_regression_test_path. The pipeline checks out
  # the VULNERABLE commit, overlays the test the fix ADDED (source stays vulnerable),
  # then build_script + run_script. Verdict: test FAILS on the vulnerable build =
  # reproduced. Env: SOURCE_DIR, BUILD_DIR, INSTALL_PREFIX, TEST_SUBDIR, TEST_NAME,
  # TEST_PATH, FIX_COMMIT, COMMIT_HASH. Standalone-compile model (simpler than
  # regenerating autotools): compile the harvested test against the built libtasn1.
  intree_test:
    build_script: |
      #!/bin/bash
      SRC="$SOURCE_DIR"; BD="$BUILD_DIR"; PFX="$INSTALL_PREFIX"
      cd "$SRC" || exit 1
      # REGISTER the harvested test: overlay the test-list Makefile.am the fix
      # commit changed. The vulnerable PARENT checkout doesn't list the new test,
      # so `make check TESTS=<name>` can't find/build it (it just errors). Makefiles
      # carry no vulnerability — the SOURCE stays vulnerable. Mirrors glibc recipe.
      for mf in $(git diff-tree --no-commit-id --name-only -r "$FIX_COMMIT" 2>/dev/null | grep -E "Makefile\.am$|Makefile\.in$"); do
        git checkout "$FIX_COMMIT" -- "$mf" 2>/dev/null && echo "overlaid makefile: $mf"
      done
      if [ ! -x "$SRC/configure" ]; then
        git submodule update --init >/build/bootstrap.log 2>&1 || true
        touch ChangeLog AUTHORS NEWS README 2>/dev/null || true   # GNU automake requires these
        ( ./bootstrap --skip-po >>/build/bootstrap.log 2>&1 || autoreconf -fi >>/build/bootstrap.log 2>&1 ) || true
      fi
      cd "$BD" || exit 1; rm -rf ./*
      "$SRC"/configure --prefix="$PFX" --disable-doc CFLAGS="-O2 -g -w" > /build/cfg.log 2>&1 && echo CONFIG_OK || { echo CONFIG_FAIL; tail -25 /build/cfg.log; }
      make -j"$(nproc)" -k > /build/make.log 2>&1; echo "BUILD_RC=$?" >> /build/build_status
      make install -k >> /build/make.log 2>&1 || true
      tail -15 /build/make.log; echo "build complete"
    run_script: |
      #!/bin/bash
      PFX="$INSTALL_PREFIX"
      cd "$BUILD_DIR" || { echo "SSD_TEST_RESULT=NORESULT (no build dir)"; exit 2; }
      # Build-honesty gate: need the built libtasn1 (installed OR libtool .libs),
      # else NORESULT (never fall through to the host libtasn1).
      if ! ls "$PFX"/lib/libtasn1.so* "$BUILD_DIR"/lib/.libs/libtasn1.so* 2>/dev/null | grep -q .; then
        echo "SSD_TEST_RESULT=NORESULT (no built libtasn1 to test against)"; exit 2
      fi
      export LD_LIBRARY_PATH="$PFX/lib:$BUILD_DIR/lib/.libs"
      # Run ONLY the harvested test through automake's own harness. `make check
      # TESTS=<name>` builds the test ON DEMAND — generating the asn1_tab.h headers
      # it #includes and wiring srcdir for the .asn data files — then runs it via the
      # test-driver, which writes a <name>.trs verdict. A plain build/standalone
      # compile can't do this (the test isn't built by `make all`, and needs the
      # generated headers). On the VULNERABLE build the test FAILS = reproduced.
      echo "--- make check TESTS=$TEST_NAME (subdir: $TEST_SUBDIR) ---"
      timeout "${INTREE_TEST_TIMEOUT:-400}" make -C "$TEST_SUBDIR" check TESTS="$TEST_NAME" > /tmp/mt.log 2>&1; rc=$?
      tail -30 /tmp/mt.log
      # Trust ONLY the automake .trs verdict (written when the test actually RAN).
      # A make-check failure WITHOUT a .trs means the test didn't run (not
      # registered / failed to build / generated-header error) — that is NORESULT,
      # NOT a reproduction. Only a real PASS/FAIL from a test that executed counts.
      TRS="$BUILD_DIR/$TEST_SUBDIR/$TEST_NAME.trs"
      if [ ! -f "$TRS" ]; then
        echo "no .trs produced — test did not run (registration/build error)"
        echo "SSD_TEST_RESULT=NORESULT"; exit 2
      fi
      echo "--- $TRS ---"; cat "$TRS"
      if grep -qE ":test-result:[[:space:]]*PASS" "$TRS"; then echo "SSD_TEST_RESULT=PASS"; exit 0; fi
      if grep -qE ":test-result:[[:space:]]*(FAIL|ERROR|XPASS)" "$TRS"; then echo "SSD_TEST_RESULT=FAIL"; exit 1; fi
      echo "SSD_TEST_RESULT=NORESULT"; exit 2

  build_system: "autotools"
  extra_configure_flags: []
