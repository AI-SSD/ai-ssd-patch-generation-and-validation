# =============================================================================
# AI-SSD Project – Unified Pipeline Configuration
# =============================================================================
# Single source of truth for Phases 1-4 and the master pipeline orchestrator.
# Phase 0 (cve_aggregator) uses its own YAML (glibc_config.yaml / aggregator_config.yaml)
# but shares the LLM and path settings defined here where applicable.
# =============================================================================

# =============================================================================
# Global Settings
# =============================================================================

# Phase 0 configuration file (relative to base directory)
phase0_config: "cve_aggregator/glibc_config.yaml"

# Per-phase process timeouts (seconds) – used by the master pipeline executor
phase_timeouts:
  0: 14400       # Phase 0: Data aggregation (API calls + git operations)
  1: 28800      # Phase 1: Vulnerability reproduction (Docker builds). 8h — the
                # full set is ~56 CVEs, many needing a fresh ~15-20 min glibc
                # build; 1h only got ~halfway. This is a safety cap, not a target;
                # cached images make re-runs much faster.
  2: 10800      # Phase 2: Patch generation (LLM API calls)
  3: 7200       # Phase 3: Patch validation (Docker builds + PoC + SAST)
  4: 600        # Phase 4: Reporting

# Docker-level timeouts (seconds) – used inside individual phases
build_timeout: 3600     # Docker image build timeout
run_timeout: 300        # Container run / PoC execution timeout

# Phase 1 baseline determinism: a memory-bug PoC can exit non-deterministically
# (ASLR / heap layout / timing), so a single run may record a flaky baseline
# that Phase 3 then compares against. The baseline PoC is run up to
# `baseline_runs` times. A crash / explicit exit code is accepted once
# `baseline_min_agree` runs agree (early-stop). A timeout / -1 baseline is the
# weakest signal, so it requires UNANIMITY — every run must hang — otherwise the
# CVE is routed to manual revision as non-deterministic. Set baseline_runs: 1 to
# restore single-run behaviour.
baseline_runs: 3          # max baseline executions per CVE
baseline_min_agree: 2     # identical crash runs required to trust the baseline
                          # (timeout baselines always require all baseline_runs)

# Docker resource settings
docker:
  # Per-container memory ceiling for PoC execution (Phase 1 baseline + Phase 3
  # validation). Memory-amplifying overflow PoCs (e.g. CVE-2012-4412 feeds a
  # ~410 MB string into strcoll, whose internal buffers push past 2 GB) get
  # OOM-killed (exit 137) BEFORE the bug's behaviour diverges between the
  # vulnerable and patched builds — making the baseline useless. A higher ceiling
  # lets the overflow actually manifest as a corruption crash a patch can fix.
  memory_limit: "6g"
  cpu_limit: 1
  network_disabled: true

# =============================================================================
# Directory Layout (relative to base directory)
# =============================================================================

paths:
  csv_file: "documentation/file-function.csv"
  exploits_dir: "exploits"
  docker_builds: "docker_builds"
  results: "results"
  logs: "logs"
  patches: "patches"
  validation_results: "validation_results"
  reports: "reports"
  manual_supervision: "manual_supervision"
  documentation: "documentation"

# Vulnerability detection patterns (Phase 1)
detection_patterns:
  exit_codes:
    - 139  # SIGSEGV
    - 134  # SIGABRT
  log_patterns:
    - "stack smashing"
    - "overflow"
    - "corrupted"
    - "double free"
    - "buffer overflow"

# =============================================================================
# LLM Settings (Phase 2 patch generation + master pipeline health check)
# =============================================================================

llm:
  # -------------------------------------------------------------------------
  # Backend provider: "ollama" (local GPU server) or "openai" (OpenAI API)
  # -------------------------------------------------------------------------
  provider: "openai"

  # -------------------------------------------------------------------------
  # Ollama settings (used only when provider: "ollama")
  # -------------------------------------------------------------------------

  # Ollama-compatible chat API endpoint
  endpoint: "http://10.3.2.171:80/api/chat"

  # Models to iterate through for patch generation
  models:
    - "qwen2.5-coder:1.5b"
    - "qwen2.5-coder:7b"
    - "qwen2.5:1.5b"
    - "qwen2.5:7b"

  # Ollama context window (avoids silent 4096 truncation)
  num_ctx: 32768

  # Wait for GPU before generation (seconds, 0 = skip)
  gpu_wait_timeout: 120

  # Health check settings (used by master pipeline before Phase 2)
  health_check:
    timeout: 60           # Health-check request timeout (seconds)
    num_predict: 5        # Minimal token count for the probe request

  # -------------------------------------------------------------------------
  # OpenAI settings (used only when provider: "openai")
  # -------------------------------------------------------------------------

  # Model to use. gpt-4.1-mini is a non-reasoning model with a 10 M token/day
  # free tier – well suited for code generation tasks.
  openai_model: "gpt-4.1-mini"

  # API key. The OPENAI_API_KEY environment variable takes precedence.
  # If neither is set the pipeline will raise an error at startup.
  # Do NOT commit a real key here; prefer the environment variable.
  openai_api_key: ""

  # -------------------------------------------------------------------------
  # Shared request settings (apply to both providers)
  # -------------------------------------------------------------------------
  timeout: 600            # Per-request timeout (seconds)
  retry_attempts: 2       # Retry attempts on failure
  retry_delay: 5          # Delay between retries (seconds)

  # Generation parameters
  temperature: 0.2        # Lower = more deterministic
  # Max output tokens. Raised from 8192: whole-function regeneration of very
  # large functions (e.g. glibc's ~1240-line ____STRTOF_INTERNAL ≈ 7.7k tokens)
  # was truncated mid-function at 8192 → "unclosed braces" → syntax-invalid.
  # gpt-4.1-mini allows up to 16384 output tokens; this gives ~2x headroom.
  max_tokens: 16384       # Maximum tokens in response

# =============================================================================
# Phase 3: Validation Settings
# =============================================================================

validation:
  auto_validate: false
  validate_timeout: 600       # Per-patch validation timeout (seconds)
  build_timeout: 3600         # Validation Docker build timeout (seconds)
  poc_timeout: 300            # PoC execution timeout (seconds)

  # SAST Configuration
  # The SAST tool list, severity gate (fail_on) and per-tool timeout are
  # project-/language-specific, so they live in the active project's Phase 0
  # YAML under its `sast:` section (e.g. cve_aggregator/glibc_config.yaml),
  # resolved via the `phase0_config` pointer above. Nothing SAST-related is
  # configured here — see master_pipeline/sast_config.py.

  # Baseline comparison
  baseline:
    compare_to_baseline: true
    tolerance_errors: 0
    tolerance_warnings: 5

  # Cleanup
  cleanup:
    remove_images: true
    remove_build_dirs: false
    keep_failure_logs: true

# =============================================================================
# Iterative Feedback Loop (Self-Healing) Settings
# =============================================================================

feedback_loop:
  enabled: true
  max_retries: 3
  timeout: 7200               # Total feedback-loop timeout (seconds)

  # -------------------------------------------------------------------------
  # Per-attempt model escalation (optional).
  #
  # Keys are ATTEMPT numbers, values are model ids:
  #   1 = the initial Phase 2 generation
  #   2 = first retry, 3 = second retry, 4 = third retry
  # (with max_retries: 3 there are 4 attempts total: 1 initial + 3 retries).
  #
  # The idea: if the first patch fails, retry with a stronger/different model,
  # escalating further on each subsequent failure. An attempt number not listed
  # here falls back to llm.openai_model. Leave this section empty (or remove it)
  # to use llm.openai_model for every attempt (legacy behavior).
  #
  # Only honored for llm.provider: openai. Set these to model ids your API key
  # can actually access — an unknown id makes that attempt's generation fail
  # gracefully (logged as generation_failed) and the loop moves on.
  models_by_attempt:
    1: "gpt-4.1-mini"        # initial generation
    2: "gpt-5-mini"          # 1st retry — escalate
    3: "gpt-5.4-mini"        # 2nd retry
    4: "gpt-4.1"             # 3rd retry — escalate again

  retry_on:
    poc_still_works: true
    sast_failed: true
    # Methodology v2: Phase 3 build error = the patch failed to compile in
    # the Phase 1 image (incremental rebuild) — compiler output is injected
    # as feedback context, so retrying is meaningful.
    build_error: true
    # A patch that turned the deterministic baseline into a timeout/hang is a
    # failed patch (self-inflicted DoS); the hang is injected as feedback.
    poc_hang: true

  context_injection:
    include_poc_output: true
    max_poc_output_length: 1500
    include_sast_findings: true
    max_sast_findings: 5

  output:
    save_retry_artifacts: true
    keep_validation_history: true
    create_success_marker: true

# =============================================================================
# Manual Verification (Phase 0 post-processing)
# =============================================================================

manual_verification:
  timeout: 1800               # Wait for manual review (seconds)
  poll_interval: 30           # Poll frequency (seconds)
  auto_skip: true             # true = never prompt; auto-exclude every CVE still
                              #        pending manual review (unattended runs).
                              #        Override per-run with --auto-skip-manual.
