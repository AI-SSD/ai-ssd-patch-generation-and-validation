# =============================================================================
# AI-SSD Project – Unified Pipeline Configuration
# =============================================================================
# Single source of truth for Phases 1-4 and the master pipeline orchestrator.
# Phase 0 (cve_aggregator) uses its own YAML (glibc_config.yaml / aggregator_config.yaml)
# but shares the LLM and path settings defined here where applicable.
# =============================================================================

# =============================================================================
# Global Settings
# =============================================================================

# Push notifications (ntfy). Read by BOTH layers from this one block:
#   - run_all.sh             : run / stage / project / cell (AI) transitions
#   - master_pipeline.notify : per-phase start / done / failure inside each cell
# run_all.sh uses it when NTFY_TOPIC is unset in the env (env still wins).
notifications:
  ntfy_url: "https://ntfy.sh/ai-ssd-tiago-7f3a"   # full topic URL (or self-hosted)
  ntfy_token: ""                                   # optional Bearer token
  enabled: true

  # --- Granularity: which run state changes to push (true = "complete"). ------
  # ISSUES (any failure / timeout / abort) are ALWAYS sent regardless of these,
  # as long as `enabled` is true. Flip a toggle to false to mute that class.
  notify_run: true        # benchmark start / finish                 (run_all.sh)
  notify_stage: true      # Stage 1/2/3 start + done                 (run_all.sh)
  notify_project: true    # each project's baseline starting         (run_all.sh)
  notify_cell: true       # each project×profile (AI) cell start/done(run_all.sh)
  notify_phase: true      # each phase start/done inside a cell      (master_pipeline)

  # Priority of routine (non-issue) pushes: low | default | high | max.
  # `low` delivers silently (no buzz); issues always escalate to `high`.
  default_priority: "default"

# Phase 0 configuration file (relative to base directory)
phase0_config: "cve_aggregator/glibc_config.yaml"

# Per-phase process timeouts (seconds) – used by the master pipeline executor
phase_timeouts:
  0: 14400       # Phase 0: Data aggregation (API calls + git operations)
  1: 28800      # Phase 1: Vulnerability reproduction (Docker builds). 8h — the
                # full set is ~56 CVEs, many needing a fresh ~15-20 min glibc
                # build; 1h only got ~halfway. This is a safety cap, not a target;
                # cached images make re-runs much faster.
  2: 10800      # Phase 2: Patch generation (LLM API calls)
  3: 57600      # Phase 3: Patch validation (Docker builds + PoC + SAST). 16h —
                # best-of-N (generation.num_candidates=4, now the default) does ~4×
                # the validation builds, and a large project (tcpdump, 121 CVEs) can
                # exceed the old 8h cap — especially when a host-global build
                # semaphore (SSD_BUILD_SLOTS) serializes builds across concurrent
                # cells. The idle watchdog (phase_idle_timeouts) still kills a true
                # stall early, so this larger hard cap only covers healthy-but-long runs.
  4: 600        # Phase 4: Reporting

# Per-phase INACTIVITY (idle) timeouts (seconds) — used by the executor's idle
# watchdog ALONGSIDE phase_timeouts above. A phase is killed early only if it
# makes NO progress for this long: neither a live_progress heartbeat (the
# per-item .live_progress_p{N}.json file, rewritten after each CVE) nor any child
# stdout/stderr. Unlike phase_timeouts (a fixed wall-clock cap that must be
# hand-sized to the whole workload), the idle cap SCALES automatically — every
# processed item resets the clock, so a healthy-but-slow run of any length
# survives and only a genuine stall (wedged Docker build, hung LLM/API call) is
# terminated. phase_timeouts remains as a hard backstop against a busy loop that
# never finishes. Each value MUST exceed the worst-case SINGLE-item silent
# stretch: for Phase 1/3 that is a cold glibc build (~15-20 min) plus a hang-PoC
# baseline (3×300s) with no heartbeat in between. Set 0 to disable idle detection
# for a phase (hard cap only).
phase_idle_timeouts:
  0: 1800       # Phase 0: per-CVE NVD API + git ops; 30-min silence = stuck
  1: 2400       # Phase 1: cold build + 3×300s hang baseline between heartbeats
  2: 1800       # Phase 2: a mid-CVE pulser (llm.heartbeat_interval) refreshes the
                # heartbeat every ~60s, so this only fires if a CVE is silent for
                # 30 min despite the pulser — i.e. a truly wedged process
  3: 2400       # Phase 3: cold incremental rebuild + PoC run between heartbeats
  4: 600        # Phase 4: reporting is fast and steadily writes to stdout

# An in-tree test is a DETACHED container the phase waits on — silent from launch
# to exit — so its whole container ceiling is one uninterrupted quiet stretch. For
# projects whose ceiling exceeds the caps above (glibc: 2520s vs 2400s) the
# watchdog would kill a healthy phase, so phases 1 and 3 raise their cap to
# ceiling + this allowance (which covers the image build preceding the run).
# Projects with no in-tree recipe keep the tight cap above, unchanged.
intree_idle_build_allowance: 1800

# Docker-level timeouts (seconds) – used inside individual phases
build_timeout: 3600     # Docker image build timeout
run_timeout: 300        # Container run / PoC execution timeout

# In-tree (Option A) container ceiling. NOT run_timeout: an in-tree verdict is a
# marker the project's own recipe PRINTS (SSD_TEST_RESULT=PASS|FAIL), and the
# recipe bounds itself with `timeout` so even a hanging test reaches its final
# echo — exit 124 becomes FAIL, which for an infinite-loop CVE (CWE-835) is the
# reproduction. If the container ceiling fires first, the shell is killed before
# printing anything and the hang is misfiled as an anonymous build/run error.
# Under the old flat 300s ceiling EVERY project's recipe declared budgets at or
# above it (glibc's cascade declares 320+320+320+1500), so the ceiling always
# won. The ceiling is now derived per project as sum(recipe budgets) + margin,
# clamped to [floor, cap] — see master_pipeline/intree.py. Phases 1 and 3 use the
# identical number so the fail-to-pass oracle compares like with like.
intree_container_floor: 600    # never go below this (Phase 3's historic budget)
intree_timeout_margin: 60      # headroom above the recipe's own budgets
intree_container_cap: 3600     # hard bound so a wedged container can't hold a slot

# Phase 1 baseline determinism: a memory-bug PoC can exit non-deterministically
# (ASLR / heap layout / timing), so a single run may record a flaky baseline
# that Phase 3 then compares against. The baseline PoC is run up to
# `baseline_runs` times. A crash / explicit exit code is accepted once
# `baseline_min_agree` runs agree (early-stop). A timeout / -1 baseline is the
# weakest signal, so it requires UNANIMITY — every run must hang — otherwise the
# CVE is routed to manual revision as non-deterministic. Set baseline_runs: 1 to
# restore single-run behaviour.
baseline_runs: 3          # max baseline executions per CVE
baseline_min_agree: 2     # identical crash runs required to trust the baseline
                          # (timeout baselines always require all baseline_runs)
# How many of the baseline runs execute CONCURRENTLY. A timeout/hang baseline
# requires unanimity (every run must hit run_timeout), so those runs otherwise
# SUM: baseline_runs × run_timeout of pure waiting — the dominant Phase 1 cost.
# Running them in parallel collapses that to ~one run_timeout. 1 = sequential
# (default; keeps the early-stop on agreeing crash signatures, byte-for-byte the
# prior behavior). Set to baseline_runs (e.g. 3) to fully parallelize — costs up
# to that many concurrent 1-CPU/6 GB containers for one CVE at a time, so size it
# to the host. (Baseline memoization already skips re-running unchanged images.)
baseline_max_parallel: 1   # per-run override: env SSD_BASELINE_PARALLEL

# Docker resource settings
docker:
  # Per-build compile-jobs cap for the Phase-3 patched rebuild (the project YAML's
  # patch_rebuild_script runs `make -j"${SSD_MAKE_JOBS:-$(nproc)}"`). Empty/unset
  # ⇒ $(nproc) — all cores, unchanged. Set this (or env SSD_MAKE_JOBS) when raising
  # validation.max_workers so N concurrent rebuilds don't oversubscribe the host
  # (target N × make_jobs ≈ cores). Threaded into the build as a build-arg.
  make_jobs: ""
  # Per-container memory ceiling for PoC execution (Phase 1 baseline + Phase 3
  # validation). Memory-amplifying overflow PoCs (e.g. CVE-2012-4412 feeds a
  # ~410 MB string into strcoll, whose internal buffers push past 2 GB) get
  # OOM-killed (exit 137) BEFORE the bug's behaviour diverges between the
  # vulnerable and patched builds — making the baseline useless. A higher ceiling
  # lets the overflow actually manifest as a corruption crash a patch can fix.
  memory_limit: "6g"
  cpu_limit: 1
  network_disabled: true

# =============================================================================
# Directory Layout (relative to base directory)
# =============================================================================

paths:
  csv_file: "documentation/file-function.csv"
  exploits_dir: "exploits"
  docker_builds: "docker_builds"
  results: "results"
  logs: "logs"
  patches: "patches"
  validation_results: "validation_results"
  reports: "reports"
  manual_supervision: "manual_supervision"
  documentation: "documentation"

# Vulnerability detection patterns (Phase 1)
detection_patterns:
  exit_codes:
    - 139  # SIGSEGV
    - 134  # SIGABRT
  log_patterns:
    - "stack smashing"
    - "overflow"
    - "corrupted"
    - "double free"
    - "buffer overflow"

# =============================================================================
# LLM Settings (Phase 2 patch generation + master pipeline health check)
# =============================================================================

llm:
  # -------------------------------------------------------------------------
  # Backend provider: "ollama" (local GPU server) or "openai" (OpenAI API)
  # -------------------------------------------------------------------------
  provider: "openai"

  # -------------------------------------------------------------------------
  # Ollama settings (used only when provider: "ollama")
  # -------------------------------------------------------------------------

  # Ollama-compatible chat API endpoint
  endpoint: "http://10.3.1.226:80/api/chat"

  # Models to iterate through for patch generation. Fallback only — a profile's
  # LLM_MODELS_BY_ATTEMPT overrides this. Kept SINGLE-model: the current
  # campaign runs uniform profiles (one model per run) so the shared Ollama GPU
  # never swaps model families mid-run (see profiles/README.md).
  models:
    - "qwen2.5-coder:7b"

  # Ollama context window (avoids silent 4096 truncation)
  num_ctx: 32768

  # Host-global GPU semaphore. Bounds GPU-bound inference (Phase 2 generation +
  # the feedback loop) across concurrently-running cells by the number of GPUs
  # (gpu_slots below) so no single GPU is ever thrashed by two model families
  # at once — flock'd slot files, auto-released if a cell dies. NO-OP for
  # provider: openai (no local GPU; the limit there is API rate, and those
  # cells already run in parallel) and effectively free when only one cell runs
  # (uncontended). This is the safety primitive that makes raising run_all.sh's
  # OLLAMA_PARALLEL (and overlapping Phase 2 with another cell's Phase 3) safe.
  # Override per-host with SSD_GPU_LOCK=0/1; lock dir via SSD_GPU_LOCK_DIR
  # (defaults to $SSD_PIPELINE_ROOT/.locks).
  gpu_lock: true

  # How many GPUs the pipeline may use concurrently: the gpu_lock semaphore
  # width, the residency budget (how many model families may stay loaded at
  # once — one per GPU), and run_all.sh's Ollama generation-lane width. The
  # 226 proxy server has 2x L40S. Detection ladder (cve_aggregator/utils/
  # gpu_slots.py; first hit wins):
  #   1. SSD_GPU_SLOTS env — run_all.sh probes once at run start and exports
  #      this, so every cell of a run agrees on one number.
  #   2. an integer here (e.g. 2) — the simple explicit choice.
  #   3. "auto": gpu_probe_command output > local nvidia-smi (only when the
  #      endpoint host is this machine) > 1 (single-GPU legacy).
  # NOTE the Ollama SERVER must also allow it: on the GPU host set
  # OLLAMA_MAX_LOADED_MODELS >= GPU count (modern Ollama defaults to 3x GPU
  # count, so this usually already holds). Client-side slots cannot change
  # server scheduling.
  gpu_slots: "auto"

  # Availability probe for a REMOTE GPU host (the Ollama HTTP API exposes no
  # GPU inventory, so "auto" cannot see a remote server's GPUs without this).
  # A shell command that prints either a bare integer (the slot count) or
  # nvidia-smi CSV "memory.used, memory.total" (MiB) lines, e.g.:
  #   ssh admin@10.3.1.226 nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits
  # CSV mode counts a GPU as available unless a foreign workload already holds
  # >= gpu_busy_memory_fraction of its memory (our own resident model — ~17%
  # of an L40S for a 7B — never disqualifies a GPU). Empty = no probe.
  gpu_probe_command: ""
  gpu_busy_memory_fraction: 0.9

  # Periodic re-detection timer. run_all.sh starts a background poller
  # (cve_aggregator/utils/gpu_slots.py --watch) that re-runs the detection
  # ladder every gpu_poll_interval seconds and publishes the count to
  # $lockdir/gpu_slots.current, which every cell reads at GPU-acquisition time.
  # So a GPU freed by a foreign workload is picked up WITHOUT restarting cells:
  # the next poll raises the count and subsequent acquisitions use the extra
  # GPU. The live file wins over the SSD_GPU_SLOTS env fallback; a poller that
  # dies leaves a stale file that cells ignore after ~900s, reverting to env/
  # config. Set to 0 to disable the poller (static count from the ladder).
  gpu_poll_interval: 60

  # GPU exclusivity gate (cve_aggregator/utils/gpu_monitor.py): only LOAD a
  # model when the GPU is empty or already serving that same model, so a fresh
  # load never lands beside another resident model and partially offloads to
  # CPU. Enforced before Phase 2 generation + preload, Phase 0 repair, and the
  # first Phase 1/3 negative-filter call. Works entirely over the Ollama HTTP
  # API (/api/ps to inspect residency + size_vram; keep_alive:0 to unload) —
  # no SSH to the GPU host required. Modes:
  #   evict (default) — actively unload foreign resident models (leftovers from
  #                     a previous cell's profile on this dedicated server)
  #   wait            — only poll until they expire; never unloads anything
  #   off             — legacy behaviour (no gate)
  # Env override: SSD_GPU_EXCLUSIVE=evict|wait|off. Complements gpu_lock:
  # the lock orders our requests, the gate controls what is resident in VRAM.
  gpu_exclusive: "evict"

  # Wait for GPU before generation (seconds, 0 = skip). Also bounds how long
  # the exclusivity gate waits for foreign models to unload.
  gpu_wait_timeout: 120

  # How long the Ollama server keeps OUR model resident after a request
  # (Phase 2 preload/requests). Long enough to bridge per-CVE gaps, short
  # enough that an idle leftover expires on its own between cells.
  keep_alive: "15m"

  # Health check settings (used by master pipeline before Phase 2)
  health_check:
    timeout: 60           # Health-check request timeout (seconds)
    num_predict: 5        # Minimal token count for the probe request

  # -------------------------------------------------------------------------
  # OpenAI settings (used only when provider: "openai")
  # -------------------------------------------------------------------------

  # Model to use. gpt-4.1-mini is a non-reasoning model with a 10 M token/day
  # free tier – well suited for code generation tasks.
  openai_model: "gpt-4.1-mini"

  # API key. The OPENAI_API_KEY environment variable takes precedence.
  # If neither is set the pipeline will raise an error at startup.
  # Do NOT commit a real key here; prefer the environment variable.
  openai_api_key: ""

  # -------------------------------------------------------------------------
  # Shared request settings (apply to both providers)
  # -------------------------------------------------------------------------
  timeout: 600            # Per-request HARD wall-clock cap (seconds). Phase 2
                          # enforces this as a true total-time deadline (not just
                          # requests' between-bytes inactivity timeout), so a
                          # wedged/dribbling backend can't block one call past it.
  retry_attempts: 2       # Retry attempts on failure
  retry_delay: 5          # Delay between retries (seconds)
  # While a CVE is being processed, Phase 2 refreshes the live-progress heartbeat
  # every this-many seconds so the executor idle watchdog (phase_idle_timeouts[2])
  # does not false-kill a healthy-but-slow CVE mid-LLM-call. Keep well below that
  # idle timeout. 0 disables the pulser (revert to per-CVE-only heartbeats).
  heartbeat_interval: 60

  # Generation parameters
  temperature: 0.2        # Lower = more deterministic
  # Max output tokens. Raised from 8192: whole-function regeneration of very
  # large functions (e.g. glibc's ~1240-line ____STRTOF_INTERNAL ≈ 7.7k tokens)
  # was truncated mid-function at 8192 → "unclosed braces" → syntax-invalid.
  # gpt-4.1-mini allows up to 16384 output tokens; this gives ~2x headroom.
  max_tokens: 16384       # Maximum tokens in response

  # ---------------------------------------------------------------------------
  # Per-model context windows (OpenAI provider), in TOTAL tokens (prompt+output).
  # The OpenAI call path uses this to (a) skip a prompt that cannot fit the
  # model's window — recorded as context_skip, exactly like the Ollama path —
  # and (b) shrink the requested output budget so prompt+output never exceeds
  # the window. Needed for legacy small-window models (gpt-4 = 8K, gpt-3.5 =
  # 16K); modern models are far larger than any prompt this pipeline builds, so
  # the cap never binds and their behaviour is unchanged.
  # Lookup is by exact model id, then by longest matching prefix, then
  # openai_default_context_window. Purely model-keyed: no per-CVE/per-project
  # logic, so adding a model is a one-line config change.
  #
  # Some models additionally cap the COMPLETION independently of the window
  # (gpt-3.5-turbo: 16K window but at most 4096 output tokens), so that cap is
  # configured separately; the effective output budget is the minimum of
  # max_tokens, this cap, and the room the prompt leaves in the window.
  openai_default_context_window: 128000
  model_context_windows:
    "gpt-4": 8192               # gpt-4-0613 (legacy, Sep-2021 cutoff)
    "gpt-4-0613": 8192
    "gpt-4-32k": 32768
    "gpt-3.5-turbo": 16385      # -0125 / -1106
    "gpt-3.5-turbo-16k": 16385
    "gpt-3.5-turbo-instruct": 4096
    "gpt-4-turbo": 128000
    "gpt-4o": 128000
    "gpt-4o-mini": 128000
    "gpt-4.1": 1047576
    "gpt-5": 400000

  # Hard per-model completion caps (tokens). Only models whose output cap is
  # SMALLER than their window need an entry; anything absent is bounded by the
  # window alone.
  model_max_output_tokens:
    "gpt-4": 4096
    "gpt-4-0613": 4096
    "gpt-3.5-turbo": 4096       # 16K window but max 4096 completion tokens
    "gpt-3.5-turbo-16k": 4096
    "gpt-3.5-turbo-instruct": 4096
    "gpt-4-turbo": 4096
    "gpt-4o": 16384
    "gpt-4.1": 32768
    "gpt-5": 128000

# =============================================================================
# Contamination filter (Phase 2 scope gate)
# =============================================================================
# When enabled, patch generation (and therefore Phases 3-4 and the feedback
# loop, which only consume Phase 2's output) is restricted to CVEs whose NVD
# publication date is STRICTLY AFTER the active model's training-data cutoff —
# so the model cannot have seen the vulnerability, its advisory, or its fix
# during training. Phases 0-1 are untouched (they use no generation LLM and
# their baselines are shared across model profiles), so the full dataset and
# reproduction baselines stay identical; only the set of CVEs the model is
# asked to patch narrows.
#
# The effective cutoff is the LATEST (max) cutoff across the active profile's
# model ramp (llm.models / feedback_loop.models_by_attempt). With the current
# uniform single-model profiles that is simply that model's date; if a ramp is
# ever reintroduced, the newest model's date governs — a CVE is only "clean"
# if it postdates EVERY model that may touch it.
#
# Env overrides (profile/env transport, same pattern as LLM_*):
#   SSD_CONTAMINATION_FILTER=1|0   -> enabled
#   LLM_TRAINING_CUTOFF=YYYY-MM-DD -> explicit cutoff (skips the map lookup)
#
# With the filter enabled, a ramp model MISSING from model_cutoffs (and no
# LLM_TRAINING_CUTOFF) aborts Phase 2 loudly — silently including possibly
# contaminated CVEs would invalidate the study.
# ENABLED 2026-08-05: contamination-controlled protocol is now the default —
# every model is only asked to patch CVEs published strictly after its own
# training cutoff. Disable per run with SSD_CONTAMINATION_FILTER=0 (profile
# env) or by flipping this flag for a full-corpus campaign.
contamination_filter:
  enabled: true

  # Optional explicit cutoff date (YYYY-MM-DD); wins over model_cutoffs.
  # cutoff_override: "2024-09-30"

  # Training-data cutoff per model (YYYY-MM-DD). Sources:
  #  - Qwen2.5 / Qwen2.5-Coder: the model RELEASE date is used as a conservative
  #    upper bound (training data cannot postdate release; the commonly cited
  #    knowledge cutoff, Oct 2023, is earlier). Base family released 2024-09-19;
  #    the coder 14b/32b sizes shipped in the 2024-11-12 wave.
  #  - OpenAI: documented knowledge cutoffs (platform.openai.com model pages).
  model_cutoffs:
    "qwen2.5:1.5b": "2024-09-19"
    "qwen2.5:7b": "2024-09-19"
    "qwen2.5:14b": "2024-09-19"
    "qwen2.5:32b": "2024-09-19"
    "qwen2.5-coder:1.5b": "2024-09-19"
    "qwen2.5-coder:7b": "2024-09-19"
    "qwen2.5-coder:14b": "2024-11-12"
    "qwen2.5-coder:32b": "2024-11-12"
    # Legacy models: OpenAI documents a Sep-2021 knowledge cutoff for both.
    # These are the ONLY still-available capable models predating the tcpdump
    # corpus (see profiles/openai-gpt4.env). Shut down 2026-10-23.
    "gpt-4": "2021-09-30"
    "gpt-4-0613": "2021-09-30"
    "gpt-3.5-turbo": "2021-09-30"
    "gpt-3.5-turbo-0125": "2021-09-30"
    "gpt-4.1": "2024-06-01"
    "gpt-4.1-mini": "2024-06-01"
    "gpt-4.1-nano": "2024-06-01"
    "gpt-5": "2024-09-30"
    "gpt-5-mini": "2024-05-31"
    "gpt-5-nano": "2024-05-31"
    "gpt-5.1": "2024-09-30"
    # gpt-5.4-mini: documented knowledge cutoff 2025-08-31
    # (developers.openai.com/api/docs/models/gpt-5.4-mini, checked 2026-08-05).
    "gpt-5.4-mini": "2025-08-31"
    # TODO(VERIFY): fill from OpenAI's model docs before enabling the filter on
    # these profiles — the run ABORTS if an active model has no entry here.
    # "gpt-5.2": ""
    # "gpt-5.4": ""

# =============================================================================
# Phase 2: Candidate generation (over-generate-and-validate)
# =============================================================================
# Richer generation: instead of one greedy patch per (CVE, model), generate a
# SET of candidates spanning diversity dimensions and let the Phase 3 oracle
# (PoC diff + SAST) pick the winner. The mechanism lives in
# master_pipeline/candidates.py; it is fully project-agnostic (every knob is a
# global setting, nothing per-CVE).
#
# ACTIVE CONFIG = validated best-of-N (ablation 2026-07). n=4 @ base llm.temperature
# (0.2), minimal granularity, CoT off, richer-feedback off: over-generate 4 low-temp
# candidates and keep the first that validates. This was the ONE lever that reliably
# lifted the fix rate (+~5 patches / +3.8pp on tcpdump/openai-mix, clean 3x3 variance
# separation); the diversity elaborations (multi-granularity/CoT/reflexion) were
# non-additive-to-slightly-negative and are deliberately left off. Cost ~1.5x runtime.
# To revert to legacy single-shot generation, set num_candidates: 1.
generation:
  # How many candidates to generate per (CVE, model) generation step.
  # 1 = legacy single greedy patch. >1 enables best-of-N over-generation.
  num_candidates: 4

  # Sampling temperatures used to diversify candidates. Empty -> every candidate
  # uses llm.temperature (so num_candidates>1 with an empty ladder is pure
  # stochastic best-of-N at the base temperature). Example ladder: [0.2, 0.6, 0.9]
  candidate_temperatures: []

  # Patch granularities to diversify across (multi-granularity generation).
  # Supported: "minimal" (smallest anchored edit; today's behaviour),
  # "guard" (bias toward a single early bounds/validation check), and
  # "whole_function" (allow a larger rewrite, same signature). Order matters:
  # the greedy candidate always uses "minimal" first regardless of this list.
  granularities: ["minimal"]

  # Chain-of-thought prompting on the DIVERSITY candidates: ask the model to emit
  # a short 'ANALYSIS:' preamble before the SEARCH/REPLACE blocks. The parser
  # ignores leading prose, so this never corrupts the patch. The greedy candidate
  # stays CoT-off so a lazy run always has an exact-today candidate to try first.
  chain_of_thought: false

  # Reserved: inject a retrieved CWE-keyed repair-pattern exemplar (RAG). Not yet
  # implemented; leave false.
  exemplars: false

  # Cost controls (applied before the Docker-bound oracle runs):
  dedupe: true                # drop candidates whose patched file is identical
  syntactic_prefilter: true   # skip candidates that fail the gcc syntax check
  # Lazy allocation: try the greedy candidate first and only generate/validate
  # the remaining candidates if it fails. Keeps cost at today's level for the
  # CVEs a single greedy patch already fixes. false = generate all up front.
  lazy: true

  # Prompt-component ablation toggles. Each component is part of today's prompt;
  # setting one false DROPS it, so the ablation harness can measure its
  # contribution to patch success. All true ⇒ today's prompt, unchanged. The
  # ablation runner flips these per variant via SSD_PROMPT_* env vars.
  prompt_components:
    include_poc: true          # inject the PoC exploit source (the exact attack)
    include_cwe: true          # inject the CWE class + description (both the user
                               # prompt's WEAKNESS CLASS line and the system
                               # prompt's {cwe} spear variables; false ⇒ the
                               # spear variables render their neutral fallback)
    include_description: true  # inject the CVE description
    project_priming: true      # use the project's tailored system prompt;
                               # false ⇒ a generic security-engineer preamble

# =============================================================================
# Phase 3: Validation Settings
# =============================================================================

validation:
  auto_validate: false
  validate_timeout: 600       # Per-patch validation timeout (seconds)
  build_timeout: 3600         # Validation Docker build timeout (seconds)
  poc_timeout: 300            # PoC execution timeout (seconds)

  # How many patches Phase 3 validates concurrently. Each patch is an independent,
  # CPU/IO-bound Docker rebuild + PoC re-run + host-side SAST on names unique to
  # (cve, model) — NOT GPU work — so they parallelize cleanly; results are merged
  # on the main thread. 1 = sequential (default; unchanged behavior). The patched
  # rebuild is a full project recompile (the patch invalidates the cached build
  # layer), so this is usually the largest Phase-3 cost — raise it on a multi-core
  # host, but mind RAM: N concurrent compiles need ~N× the build memory.
  # Per-run override: env SSD_VALIDATION_WORKERS. NOTE: each rebuild runs
  # `make -j$(nproc)`, so raising this WITHOUT capping docker.make_jobs (above)
  # oversubscribes the cores — target (max_workers × make_jobs) ≈ host cores.
  max_workers: 1

  # SAST Configuration
  # The SAST tool list, severity gate (fail_on) and per-tool timeout are
  # project-/language-specific, so they live in the active project's Phase 0
  # YAML under its `sast:` section (e.g. cve_aggregator/glibc_config.yaml),
  # resolved via the `phase0_config` pointer above. Nothing SAST-related is
  # configured here — see master_pipeline/sast_config.py.

  # Baseline comparison
  baseline:
    compare_to_baseline: true
    tolerance_errors: 0
    tolerance_warnings: 5

  # Cleanup
  cleanup:
    remove_images: true
    remove_build_dirs: false
    keep_failure_logs: true

# =============================================================================
# Iterative Feedback Loop (Self-Healing) Settings
# =============================================================================

feedback_loop:
  enabled: true
  max_retries: 3
  timeout: 7200               # Total feedback-loop timeout (seconds)

  # -------------------------------------------------------------------------
  # Richer feedback memory (Reflexion-style). Each flag enriches the RETRY
  # prompt; all default false so the retry prompt is byte-identical to the
  # legacy behaviour (and the run stays deterministic) until you opt in.
  # -------------------------------------------------------------------------
  richer_context:
    # Show a unified diff (original function → the failed patch) so the model
    # sees EXACTLY what it changed last time, not just the patched function.
    applied_diff: false
    # Summarise ALL earlier failed attempts (capped, most-recent first) so the
    # model stops re-proposing edits that were already rejected (anti-oscillation).
    attempt_history: false
    # Require a 'DIAGNOSIS:' preamble before the edits — the model must first
    # reason about why the previous attempt failed, then fix (parser ignores it).
    reflexion: false

  # -------------------------------------------------------------------------
  # Per-attempt model escalation (optional).
  #
  # Keys are ATTEMPT numbers, values are model ids:
  #   1 = the initial Phase 2 generation
  #   2 = first retry, 3 = second retry, 4 = third retry
  # (with max_retries: 3 there are 4 attempts total: 1 initial + 3 retries).
  #
  # The idea: if the first patch fails, retry with a stronger/different model,
  # escalating further on each subsequent failure. An attempt number not listed
  # here falls back to llm.openai_model. Leave this section empty (or remove it)
  # to use llm.openai_model for every attempt (legacy behavior).
  #
  # Only honored for llm.provider: openai. Set these to model ids your API key
  # can actually access — an unknown id makes that attempt's generation fail
  # gracefully (logged as generation_failed) and the loop moves on.
  models_by_attempt:
    1: "gpt-4.1-mini"        # initial generation
    2: "gpt-5-mini"          # 1st retry — escalate
    3: "gpt-5.4-mini"        # 2nd retry
    4: "gpt-4.1"             # 3rd retry — escalate again

  retry_on:
    poc_still_works: true
    sast_failed: true
    # Methodology v2: Phase 3 build error = the patch failed to compile in
    # the Phase 1 image (incremental rebuild) — compiler output is injected
    # as feedback context, so retrying is meaningful.
    build_error: true
    # A patch that turned the deterministic baseline into a timeout/hang is a
    # failed patch (self-inflicted DoS); the hang is injected as feedback.
    poc_hang: true

  context_injection:
    include_poc_output: true
    max_poc_output_length: 1500
    include_sast_findings: true
    max_sast_findings: 5

  output:
    save_retry_artifacts: true
    keep_validation_history: true
    create_success_marker: true

# =============================================================================
# Manual Verification (Phase 0 post-processing)
# =============================================================================

manual_verification:
  timeout: 1800               # Wait for manual review (seconds)
  poll_interval: 30           # Poll frequency (seconds)
  auto_skip: true             # Phase 0: true = never hold, auto-exclude every CVE
                              #   still pending review. false + a non-interactive
                              #   (dashboard) run = HOLD and poll manual_supervision/
                              #   for dashboard approve/retry/discard/proceed.
                              #   Per-run override: --auto-skip-manual / env
                              #   MANUAL_VERIFY_AUTO_SKIP (dashboard Start form).
  phase1_gate: false          # Phase 1: false = historical (flagged items dropped
                              #   from Phase 2). true = after Phase 1, HOLD and poll
                              #   for dashboard retry/discard/proceed. Per-run
                              #   override: env PHASE1_MANUAL_GATE.
